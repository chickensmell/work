<title>부서운영비 정산</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 머리글(회차·탭·설정) + 한 줄 일정 + 탭 본문(접기 구역). 자녀학비보조와 같은 색 체계, PC 화면 기준 */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1d2330; --muted:#677084; --line:#dfe3ea; --head:#f0f2f6; --sunk:#eceef2;
  --accent:#1f5fbf; --accent-soft:#e8f0fc; --on-accent:#ffffff;
  --ok:#1e7a46; --ok-soft:#e5f4ea; --warn:#a35a00; --warn-soft:#fff3e0; --bad:#b3261e; --bad-soft:#fdeceb; --input:#fffdf3;
  --gut-l:max(16px, env(safe-area-inset-left, 0px)); --gut-r:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171d; --panel:#1c2028; --ink:#e4e8ef; --muted:#9aa3b5; --line:#323947; --head:#252a34; --sunk:#2a2f39;
  --accent:#7aa7ec; --accent-soft:#1f2c42; --on-accent:#0f1520;
  --ok:#6cc896; --ok-soft:#173025; --warn:#e8a65a; --warn-soft:#3a2a16; --bad:#f08a80; --bad-soft:#3d1d1b; --input:#22262f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171d; --panel:#1c2028; --ink:#e4e8ef; --muted:#9aa3b5; --line:#323947; --head:#252a34; --sunk:#2a2f39;
  --accent:#7aa7ec; --accent-soft:#1f2c42; --on-accent:#0f1520;
  --ok:#6cc896; --ok-soft:#173025; --warn:#e8a65a; --warn-soft:#3a2a16; --bad:#f08a80; --bad-soft:#3d1d1b; --input:#22262f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.55 "Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
header{background:var(--panel);border-bottom:1px solid var(--line);padding-block:10px;padding-left:var(--gut-l);padding-right:var(--gut-r);display:flex;gap:14px;align-items:center;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{font-size:16px;margin:0}
.tabs{display:flex;gap:4px}
.tabs button{font:inherit;font-weight:bold;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:7px 18px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.side{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.side .lk{font:inherit;border:1px solid transparent;background:none;color:var(--muted);padding:6px 10px;border-radius:6px;cursor:pointer}
.side .lk[aria-pressed="true"]{background:var(--sunk);color:var(--ink);font-weight:bold}
.saved{font-size:12px;color:var(--muted)} .saved.err{color:var(--bad);font-weight:bold}
.flow{background:var(--panel);border-bottom:1px solid var(--line);padding-block:8px;padding-left:var(--gut-l);padding-right:var(--gut-r);display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px}
.flow .f{padding:3px 10px;border-radius:12px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.flow .f.done{background:var(--ok-soft);color:var(--ok)} .flow .f.now{background:var(--bad-soft);color:var(--bad);font-weight:bold}
.flow i{font-style:normal;color:var(--muted)}
main{max-width:1440px;margin:0 auto;padding-block:16px 48px;padding-left:var(--gut-l);padding-right:var(--gut-r);display:flex;flex-direction:column;gap:12px}
select,input,textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--input);color:var(--ink)}
textarea{width:100%;min-height:90px}
.b{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.b.p{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.b.d{color:var(--bad)}
.b.sm{padding:3px 9px;font-size:12px}
.b:disabled{opacity:.5;cursor:default}
:is(.b,.tabs button,.lk,.chips button,summary):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:10px}
.card h2{font-size:15px;margin:0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.sub{font-size:12px;color:var(--muted);font-weight:normal}
.r{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
details.sec{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
details.sec>summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"▸";color:var(--muted);width:12px}
details.sec[open]>summary::before{content:"▾"}
details.sec>summary h2{font-size:15px;margin:0}
details.sec>summary .st{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
details.sec>.in{padding:0 16px 14px;display:flex;flex-direction:column;gap:12px}
details.more>summary{cursor:pointer;color:var(--accent);font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.field input,.field select{color:var(--ink);font-size:14px}
.muted{color:var(--muted)} .neg{color:var(--bad)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--head);white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
tr.click{cursor:pointer} tr.click:hover>td{background:var(--accent-soft)}
tr.sel>td{background:var(--accent-soft)}
tr.sum td{background:var(--head);font-weight:bold}
tr.edit>td{background:var(--sunk)}
td input,td select{padding:3px 6px}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:12px;margin:1px 2px 1px 0;white-space:nowrap}
.t-bad{background:var(--bad-soft);color:var(--bad)} .t-warn{background:var(--warn-soft);color:var(--warn)}
.t-ok{background:var(--ok-soft);color:var(--ok)} .t-info{background:var(--accent-soft);color:var(--accent)} .t-wait{background:var(--sunk);color:var(--muted)}
.mk{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:bold;flex:none}
.mk.y{background:var(--ok-soft);color:var(--ok)} .mk.n{background:var(--bad-soft);color:var(--bad)} .mk.w{background:var(--warn-soft);color:var(--warn)}
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.check li{display:flex;gap:10px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:8px;flex-wrap:wrap}
.notice{padding:9px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}
.notice.bad{background:var(--bad-soft);color:var(--bad)} .notice.ok{background:var(--ok-soft);color:var(--ok)} .notice.info{background:var(--accent-soft);color:var(--accent)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:13px;align-items:baseline}
.kv>span:nth-child(odd){color:var(--muted)}
.copybox{border:1px solid var(--line);border-radius:8px;background:var(--sunk);padding:10px 12px;white-space:pre-wrap;font-size:13px;line-height:1.7;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--muted)}
.tile b{display:block;font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.tile.alert b{color:var(--bad)}
.icard{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;padding:9px 12px;display:flex;flex-direction:column;gap:6px}
.icard.bad{border-left-color:var(--bad)} .icard.done{border-left-color:var(--ok);opacity:.75}
.icard .hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cards{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:14px;padding:3px 10px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.empty{padding:28px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:0;width:min(560px,94vw)}
dialog.wide{width:min(980px,96vw)}
dialog .in{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
dialog h3{margin:0;font-size:16px}
dialog img{display:block;max-width:100%;max-height:78vh;margin:0 auto}
</style>

<header>
  <h1>부서운영비 정산</h1>
  <div class="row" id="cycleBox"></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="side"><button class="lk" type="button" data-tab="set" id="setBtn">설정</button><span class="saved" id="saved"></span></div>
</header>
<div class="flow" id="flow" hidden></div>
<main id="main"><div class="empty">불러오는 중...</div></main>
<dialog id="dlg"><div class="in" id="dlgIn"></div></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
'use strict';
// ================= 기본 도구
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => n == null || n === '' || isNaN(n) ? '' : Number(n).toLocaleString('ko-KR');
const pad = n => String(n).padStart(2, '0');
const clone = o => JSON.parse(JSON.stringify(o));
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const wd = iso => '일월화수목금토'[new Date(iso + 'T00:00:00').getDay()];
const krDate = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-').map(Number); return `${y}년 ${m}월 ${d}일(${wd(iso)})`; };
const uid = () => Math.random().toString(36).slice(2, 10);
const hash = s => { let h = 5381; for (const ch of s) h = (h * 33 + ch.codePointAt(0)) >>> 0; return h.toString(36); };
const num = v => { if (v == null || v === '') return null; if (typeof v === 'number') return v; const t = String(v).replace(/[^\d.-]/g, ''); return t === '' || isNaN(+t) ? null : +t; };
const tag = (cls, t) => `<span class="tag t-${cls}">${esc(t)}</span>`;
const mk = k => `<span class="mk ${k}">${k === 'y' ? '✓' : k === 'n' ? '✕' : '!'}</span>`;
const copyBtn = id => `<button class="b sm" type="button" data-copy="${id}">복사</button>`;
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const NOTICE_RULES = `[주의사항]
- 부서 내 입·퇴사 등 인사변동이 있을 경우, 부서운영비 지급/환수 조정이 필요하오니 연락 주시기 바랍니다.
- 개인 포인트 적립, 상품권 전환 등 개인적인 이익이 발생하는 방식으로 사용할 수 없습니다.
- 개인 소장 목적의 물품 구입 및 비용 지출은 인정되지 않습니다. (예: 충전기, 키보드, 의류, 식재료, 주유비, 화장품, 장난감 등)
- 가급적 구입 품목이 확인되는 증빙을 첨부해 주시기 바라며, 추가 확인이 필요한 경우 담당자가 별도로 요청할 수 있습니다.
- 배부된 엑셀 정산 양식을 작성한 후 PDF로 변환하여 업로드해 주시기 바라며,
  여러 부서가 묶여 지급된 경우, 제출 담당자께서 비고란에 각 부서명 기입 후 제출하여 주시기 바랍니다.
- 총사용액은 지급 된 금액보다 반드시 같거나 많이 사용하여야 하며, 사업자 지출증빙 (사업자번호 들어감) 처리 건에 한해 인정이 가능합니다.`;
const DEF_META = {name:'', biz:'', acct:'', gen:30000, short:15000, kw:['꽃','화분','플라워','비품','의자','충전기','멀티탭','USB','핸드워시','상품권','선물','포인트','키보드','의류','식재료','주유','화장품','장난감','생활용품'], cur:null};

// ================= 저장 (Claude 앱 저장소, 앱 밖에서는 브라우저)
const ST = {meta: clone(DEF_META), cycles: {}, reads: {}};   // reads: {docId: {...}}
const LS_KEY = 'dept-budget-v1';
let db = null, sample = null, downloads = null, limits = null, mode = 'local';
const timers = {}, chain = {}, inflight = new Set(); let failed = false;
function setSaved(t, err) { const el = $('saved'); el.textContent = t; el.classList.toggle('err', !!err); }
function persist(path, obj) {
  if (mode === 'local') { try { localStorage.setItem(LS_KEY, JSON.stringify(ST)); setSaved('이 브라우저에 저장됨 · ' + new Date().toTimeString().slice(0, 5)); } catch { setSaved('저장 실패: 브라우저 저장 공간', true); } return; }
  clearTimeout(timers[path]); inflight.add(path);
  setSaved('저장 중...');
  timers[path] = setTimeout(() => {
    const body = {j: JSON.stringify(obj), at: new Date().toISOString()};
    chain[path] = (chain[path] || Promise.resolve()).then(() => db.doc(path).set(body)).then(() => { failed = false; }, () => { failed = true; }).then(() => {
      inflight.delete(path);
      if (!inflight.size) setSaved(failed ? '저장 실패 · 다시 고치면 다시 저장합니다' : '앱 저장소에 저장됨 · ' + new Date().toTimeString().slice(0, 5), failed);
    });
  }, 500);
}
const saveMeta = () => persist('meta/main', ST.meta);
const saveCycle = c => persist('cycles/' + c.id, c);
const saveRead = (id, r) => { ST.reads[id] = r; persist('reads/' + id, r); };
async function load() {
  if (window.claude?.use) {
    [db, sample, downloads] = await Promise.all([claude.use('db'), claude.use('sample'), claude.use('downloads')]);
    if (sample) limits = await sample.limits().catch(() => null);
  }
  if (db) {
    mode = 'db';
    const parse = d => { try { return JSON.parse(d.data().j); } catch { return null; } };
    const timer = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 10000));
    try {
      const [m, cs, rs] = await Promise.race([Promise.all([db.doc('meta/main').get(), db.collection('cycles').get(), db.collection('reads').get()]), timer]);
      if (m.exists) Object.assign(ST.meta, parse(m));
      cs.docs.forEach(d => { const v = parse(d); if (v) ST.cycles[v.id] = v; });
      rs.docs.forEach(d => { const v = parse(d); if (v) ST.reads[d.id] = v; });
      setSaved('앱 저장소 연결됨');
    } catch (e) { setSaved('앱 저장소를 읽지 못했습니다. 새로고침해 주세요.', true); }
  } else {
    try { const v = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); if (v) { Object.assign(ST.meta, v.meta || {}); ST.cycles = v.cycles || {}; ST.reads = v.reads || {}; } } catch {}
    setSaved('앱 밖에서 열림 · 이 브라우저에만 저장');
  }
}

// ================= 회차 계산
const cyc = () => ST.cycles[ST.meta.cur] || null;
const cycleLabel = c => `${c.y}년 ${c.m1}-${c.m2}월`;
const acadYear = c => c.m1 >= 3 ? c.y : c.y - 1;
const periodFrom = c => `${c.y}-${pad(c.m1)}-01`;
const periodTo = c => { const d = new Date(c.y, c.m2, 0).getDate(); return `${c.y}-${pad(c.m2)}-${pad(d)}`; };
function newCycle(y, m1, fromPrev) {
  const id = `${y}-${pad(m1)}`;
  const c = {id, y, m1, m2: m1 + 1, units: [], people: [], paid: null, changes: [], refunds: {}, used: {}, dec: {}, notes: {}, paidDate: '', dueDate: '', mailSent: '', resolDate: '', settleDate: ''};
  if (fromPrev) {
    c.units = fromPrev.units.map(u => ({...clone(u), prevHolder: u.holder}));
    c.people = fromPrev.people.filter(p => p.a[1] > 0).map(p => ({...clone(p), a: [p.a[1], p.a[1]]}));
    c.fromPrev = fromPrev.id;
  }
  return c;
}
const amt = p => p.a[0] + p.a[1];
const unitPeople = (c, no, list = c.people) => list.filter(p => p.no === no);
const active = (c, no, list) => unitPeople(c, no, list).filter(p => amt(p) > 0);
const unitSum = (c, no, list = c.people) => unitPeople(c, no, list).reduce((s, p) => s + amt(p), 0);
const monthStat = (list, i, meta = ST.meta) => { const g = list.filter(p => p.a[i] === meta.gen).length, s = list.filter(p => p.a[i] === meta.short).length, o = list.filter(p => p.a[i] > 0 && p.a[i] !== meta.gen && p.a[i] !== meta.short); return {g, s, other: o, sum: list.reduce((t, p) => t + p.a[i], 0)}; };
const totalOf = list => list.reduce((s, p) => s + amt(p), 0);
const basePeople = c => c.paid ? c.paid.people : c.people;   // 지급 결의 기준
const baseUnits = c => c.paid ? c.paid.units : c.units;

// 변동 반영 규칙 (15일 기준)
const monthOf = (c, iso) => { const [y, m] = iso.split('-').map(Number); return (y - c.y) * 12 + (m - c.m1); };   // 0=첫째 달, 1=둘째 달
const dayOf = iso => +iso.split('-')[2];
function borderline(iso) { const d = dayOf(iso); return d >= 13 && d <= 17; }
function joinAmounts(c, a, iso, rate, pay) { // pay: 그달 지급 여부(판단 결과)
  const mi = monthOf(c, iso);
  return a.map((v, i) => i > mi ? rate : i === mi ? (pay ? rate : 0) : (mi < 0 ? rate : v));
}
function leaveAmounts(c, a, iso, keep) { // keep: 그달 지급 유지 여부
  const mi = monthOf(c, iso);
  return a.map((v, i) => i < mi ? v : i === mi ? (keep ? v : 0) : 0);
}
const defJoinPay = iso => dayOf(iso) <= 15;
const defLeaveKeep = iso => dayOf(iso) >= 15;

// 환수·추가 (지급 확정 뒤 바뀐 만큼)
function diffs(c) {
  if (!c.paid) return [];
  const P = new Map(c.paid.people.map(p => [p.id, p])), C = new Map(c.people.map(p => [p.id, p]));
  const out = [];
  for (const id of new Set([...P.keys(), ...C.keys()])) {
    const a = P.get(id)?.a || [0, 0], b = C.get(id)?.a || [0, 0], p = C.get(id) || P.get(id);
    const ref = [], add = [];
    [0, 1].forEach(i => { if (a[i] > b[i]) ref.push([i, a[i] - b[i]]); if (b[i] > a[i]) add.push([i, b[i] - a[i]]); });
    if (ref.length || add.length) out.push({id, name: p.name, no: (P.get(id) || p).no, newNo: C.get(id)?.no, ref, add, refSum: ref.reduce((s, x) => s + x[1], 0), addSum: add.reduce((s, x) => s + x[1], 0)});
  }
  return out;
}

// ================= 명단 엑셀 읽기·만들기

function rosterSheet(c, list = c.people, withUsed = false) {

function rosterChecks(c) {
  const out = [];
  const prev = c.fromPrev && ST.cycles[c.fromPrev];
  for (const u of c.units) {
    const ps = unitPeople(c, u.no);
    if (!ps.some(p => amt(p) > 0)) continue;
    if (!u.holder) out.push(['n', u.no, `${u.dept}: 예금주를 읽지 못함 (명단에서 직접 넣어 주세요)`]);
    else if (!ps.some(p => p.name === u.holder && amt(p) > 0)) out.push(['n', u.no, `${u.dept}: 예금주 ${u.holder}이(가) 이 순번 명단에 없음`]);
    const pu = prev && prev.units.find(x => x.no === u.no);
    if (pu && pu.holder !== u.holder) out.push(['w', u.no, `${u.dept}: 지난 회차와 예금주가 다름 (${pu.holder || '?'} → ${u.holder || '?'})`]);
    ps.forEach(p => p.a.forEach((v, i) => { if (v && v !== ST.meta.gen && v !== ST.meta.short) out.push(['w', u.no, `${u.dept} ${p.name}: ${[c.m1, c.m2][i]}월 금액 ${won(v)}원이 단가와 다름`]); }));
  }
  // 출납명세서 대조
  if (c.cash?.trim()) {
    const lines = c.cash.split(/\n/);
    for (const u of baseUnits(c)) {
      const s = unitSum(c, u.no, basePeople(c)); if (!s) continue;
      const line = lines.find(l => u.holder && l.includes(u.holder));
      if (!line) { out.push(['n', u.no, `${u.dept}: 출납명세서에 예금주 ${u.holder}이(가) 없음`]); continue; }
      const nums = line.split(/[\t ]+/).filter(x => /^\d{1,3}(,\d{3})+$|^\d{4,8}$/.test(x.trim())).map(x => +x.replace(/,/g, '')).filter(v => v >= 1000 && v < 1e8);

}

  return `
${UI.msg ? `<div class="notice ${UI.msg.cls}">${esc(UI.msg.t)}</div>` : ''}
${sec('roster', '명단 확인', `${nErr ? tag('bad', '확인 ' + nErr) : ''}${nW ? tag('warn', '참고 ' + nW) : ''}${!chk.length ? tag('ok', '이상 없음') : ''}${locked ? tag('info', '지급 확정 ' + c.paid.at.slice(5)) : ''}`, `
  <div class="row"><span class="muted">${c.units.length}건 · ${c.m1}월 ${s0.g + s0.s}명 · ${c.m2}월 ${s1.g + s1.s}명 · ${won(totalOf(act))}원${locked ? ' (변동 반영 뒤 최종)' : ''}</span>
    <span class="r"><button class="b sm" type="button" data-act="dlRoster">명단 엑셀 받기</button>${locked ? `<button class="b sm" type="button" data-act="unlock">지급 확정 풀기</button>` : `<label class="b sm" for="rosterFile">명단 파일로 다시 올리기</label><input id="rosterFile" type="file" accept=".xlsx,.xls" hidden><button class="b sm" type="button" data-act="addUnit">순번 추가</button><button class="b sm p" type="button" data-act="lock">지급 확정</button>`}</span></div>
  ${locked ? '' : '<p class="muted" style="margin:0">명단을 확인하고 지급 결의를 올린 뒤 [지급 확정]을 누르세요. 확정 뒤 생기는 입퇴사는 "명단 변동"에 적으면 환수·추가 지급이 계산됩니다.</p>'}
  ${chk.length ? `<ul class="check">${chk.map(([k, , t]) => `<li>${mk(k)}<span>${esc(t)}</span></li>`).join('')}</ul>` : ''}
  <div class="scroll"><table>
    <thead><tr><th rowspan="2">순번</th><th rowspan="2">부서</th><th colspan="2" class="c">${c.m1}월</th><th colspan="2" class="c">${c.m2}월</th><th rowspan="2" class="n">합계 금액</th><th rowspan="2">예금주</th><th rowspan="2">확인</th></tr>
    <tr><th class="n">인원</th><th class="n">금액</th><th class="n">인원</th><th class="n">금액</th></tr></thead>
    <tbody>${rows}<tr class="sum"><td colspan="2">합계</td><td class="n">${s0.g + s0.s}</td><td class="n">${won(s0.sum)}</td><td class="n">${s1.g + s1.s}</td><td class="n">${won(s1.sum)}</td><td class="n">${won(totalOf(act))}</td><td colspan="2"></td></tr></tbody></table></div>

  <details class="more"><summary>출납명세서 대조 (결재시스템 출납명세서를 복사해 붙여넣기)</summary><textarea id="cash" placeholder="출납명세서 표를 그대로 붙여넣으면 예금주·금액을 명단과 비교합니다.">${esc(c.cash || '')}</textarea></details>`)}

function viewChange(c) {
  const ch = c.changes.filter(x => !x.undone), df = diffs(c);
  const refunds = df.filter(d => d.refSum), adds = df.filter(d => d.addSum);
  const f = UI.form, meta = ST.meta;
  const unitOpt = (sel, id) => `<select id="${id}">${c.units.map(u => `<option value="${u.no}"${+sel === u.no ? ' selected' : ''}>${u.no}. ${esc(u.dept)}</option>`).join('')}</select>`;
  const personOpt = sel => `<select id="fPerson">${c.people.filter(p => amt(p) > 0).map(p => `<option value="${p.id}"${sel === p.id ? ' selected' : ''}>${esc(c.units.find(u => u.no === p.no)?.dept || '')} · ${esc(p.name)}</option>`).join('')}</select>`;
  const kinds = ['입사', '복직', '퇴사', '휴직', '전보', '전일제→반일제', '반일제→전일제', '부서 담당자(예금주) 변경'];
  const needPerson = ['퇴사', '휴직', '전보', '전일제→반일제', '반일제→전일제'].includes(f.kind);
  const isHolder = f.kind.startsWith('부서 담당자');
  let preview = '';
  if (f.date && !isHolder) {
    const mi = monthOf(c, f.date);
    const joinLike = ['입사', '복직'].includes(f.kind), leaveLike = ['퇴사', '휴직'].includes(f.kind);
    const def = joinLike ? defJoinPay(f.date) : leaveLike ? defLeaveKeep(f.date) : f.kind === '전보' ? defLeaveKeep(f.date) : defJoinPay(f.date);
    const v = f.judge == null ? def : f.judge;
    const mName = mi === 0 ? c.m1 + '월' : mi === 1 ? c.m2 + '월' : null;
    preview = mName ? `<span class="muted">15일 기준 → ${mName}: ${joinLike ? (v ? '그달부터 지급' : '다음 달부터 지급') : leaveLike ? (v ? '그달까지 지급(환수 안 함)' : '그달부터 지급 안 함(환수)') : f.kind === '전보' ? (v ? '그달은 원래 부서, 다음 달부터 새 부서' : '그달부터 새 부서') : (v ? '그달부터 바뀐 단가' : '다음 달부터 바뀐 단가')}</span>
      ${borderline(f.date) ? `<label class="row" style="gap:6px"><span class="tag t-warn">담당자 판단</span><select id="fJudge"><option value="1"${v ? ' selected' : ''}>${joinLike ? '그달 지급' : leaveLike ? '그달 유지' : '그달은 그대로'}</option><option value="0"${!v ? ' selected' : ''}>${joinLike ? '그달 지급 안 함' : leaveLike ? '그달 환수' : '그달부터 바꿈'}</option></select></label>` : ''}` : `<span class="muted">이번 회차(${c.m1}·${c.m2}월) ${mi < 0 ? '이전' : '이후'} 날짜입니다.</span>`;
  }
  const form = `<div class="row" style="align-items:flex-end">
    <label class="field" for="fKind">구분<select id="fKind">${kinds.map(k => `<option${k === f.kind ? ' selected' : ''}>${k}</option>`).join('')}</select></label>
    ${needPerson ? `<label class="field" for="fPerson">대상자${personOpt(f.pid)}</label>` : ''}
    ${['입사', '복직'].includes(f.kind) || isHolder || f.kind === '전보' ? `<label class="field" for="fUnit">${f.kind === '전보' ? '옮겨 간 부서' : '부서(순번)'}${unitOpt(f.no, 'fUnit')}</label>` : ''}
    ${['입사', '복직'].includes(f.kind) ? `<label class="field" for="fName">이름<input id="fName" value="${esc(f.name || '')}" style="width:110px"></label><label class="field" for="fRate">구분<select id="fRate"><option value="${meta.gen}">전일제</option><option value="${meta.short}"${+f.rate === meta.short ? ' selected' : ''}>반일제</option></select></label>` : ''}
    ${isHolder ? `<label class="field" for="fHolder">새 예금주<input id="fHolder" value="${esc(f.holder || '')}" style="width:100px"></label><label class="field" for="fBank">은행<input id="fBank" value="${esc(f.bank || '')}" style="width:100px"></label>` : ''}
    <label class="field" for="fDate">일자<input id="fDate" type="date" value="${esc(f.date || '')}"></label>
    <label class="field" for="fMemo">메모<input id="fMemo" value="${esc(f.memo || '')}" placeholder="예: 인사담당 11-20 통보" style="width:180px"></label>
    <button class="b p" type="button" data-act="applyChange">명단에 반영</button>
  </div>${preview ? `<div class="row">${preview}</div>` : ''}`;
  const refundMail = d => {
    const st = c.refunds[d.id] || {};
    const months = d.ref.map(([i]) => [c.m1, c.m2][i]);
    const mLabel = months.length > 1 ? `${months[0]}-${months[months.length - 1]}월` : `${months[0]}월`;
    const amtTxt = d.refSum % 10000 === 0 ? `${d.refSum / 10000}만원` : `${won(d.refSum)}원`;
    const reason = st.reason || (ch.slice().reverse().find(x => x.pid === d.id)?.kind === '휴직' ? '휴직자 발생' : '면직자 발생');
    return `안녕하십니까, 총무처 총무팀입니다.\n\n \n\n${c.y}년 ${c.m1}-${c.m2}월 부서운영비와 관련하여 \n\n${reason}에 따른 ${mLabel} 부서운영비 ${amtTxt}을 환수 요청하고자 안내 드립니다.\n\n \n\n  -대상자: ${st.who || d.name}\n\n  -환수 금액: ${won(d.refSum)}원\n\n  -입금 계좌: ${meta.acct || '{설정의 환수 입금 계좌}'}\n\n \n\n위 계좌로 입금 후 송금확인증을 본 메일로 회신해주시기 바랍니다.\n\n문의사항이 있으신 경우, 내선번호로 연락 부탁 드립니다.\n\n \n\n업무 협조에 감사합니다.`;
  };
  const pending = refunds.filter(d => !(c.refunds[d.id] || {}).sent && !(c.refunds[d.id] || {}).skip).length;
  return sec('change', '명단 변동 <span class="sub">있을 때만</span>', `${ch.length ? tag('info', '변동 ' + ch.length) : tag('wait', '변동 없음')}${pending ? tag('bad', '환수 메일 ' + pending) : ''}${adds.length ? tag('warn', '추가 지급 ' + adds.length) : ''}`, `
  ${form}
  <p class="muted" style="margin:0">15일 기준: 15일까지 입사 → 그달부터 지급 / 14일까지 퇴사 → 그달 환수 / 13~17일은 "담당자 판단"으로 고를 수 있음.${c.paid ? '' : ' 지급 확정 전에는 명단만 고치고 환수·추가 지급은 생기지 않습니다.'}</p>
  ${ch.length ? `<div class="scroll"><table><thead><tr><th>구분</th><th>부서</th><th>대상자</th><th>일자</th><th>명단에 반영된 내용</th><th>메모</th><th></th></tr></thead><tbody>${ch.map((x, i) => `<tr><td>${esc(x.kind)}</td><td>${esc(x.dept)}</td><td>${esc(x.name)}</td><td>${x.date}</td><td>${esc(x.desc)}</td><td class="muted">${esc(x.memo || '')}</td><td>${i === ch.length - 1 ? '<button class="b sm" type="button" data-act="undoChange">되돌리기</button>' : ''}</td></tr>`).join('')}</tbody></table></div>` : '<span class="muted">이번 회차 변동 없음</span>'}
  ${refunds.length ? `<h3 style="margin:4px 0 0;font-size:14px">환수</h3>${refunds.map(d => { const st = c.refunds[d.id] || {}; return `<div class="card" style="padding:10px 12px"><div class="row"><b>${esc(c.units.find(u => u.no === d.no)?.dept || '')} · ${esc(d.name)}</b>${tag(st.sent ? 'ok' : st.skip ? 'wait' : 'bad', st.sent ? `메일 보냄 ${st.sent.slice(5)}` : st.skip ? '환수 안 함' : '메일 안 보냄')}<span>${d.ref.map(([i, v]) => `${[c.m1, c.m2][i]}월 ${won(v)}원`).join(' · ')} = <b>${won(d.refSum)}원</b></span>
      <span class="r"><input data-rf="${d.id}" data-rk="who" value="${esc(st.who || '')}" placeholder="대상자 표기 (예: 홍길동 사원)" style="width:190px"><input data-rf="${d.id}" data-rk="reason" value="${esc(st.reason || '')}" placeholder="사유 (기본: 면직자 발생)" style="width:170px">${copyBtn('rm-' + d.id)}<button class="b sm" type="button" data-rsent="${d.id}">${st.sent ? '보낸 날 지우기' : '보냄으로 표시'}</button><button class="b sm" type="button" data-rskip="${d.id}">${st.skip ? '환수 대상으로' : '환수 안 함'}</button></span></div>
      <details class="more"><summary>메일 본문 보기</summary><div class="copybox" id="rm-${d.id}" style="margin-top:6px">${esc(refundMail(d))}</div></details></div>`; }).join('')}` : ''}
  ${adds.length ? `<h3 style="margin:4px 0 0;font-size:14px">추가 지급</h3><ul class="check">${adds.map(d => `<li>${mk('w')}<span>${esc(c.units.find(u => u.no === (d.newNo ?? d.no))?.dept || '')} · ${esc(d.name)}: ${d.add.map(([i, v]) => `${[c.m1, c.m2][i]}월 ${won(v)}원`).join(' · ')} = <b>${won(d.addSum)}원</b></span><span class="muted">부서에는 먼저 쓰고 정산서에 추가분까지 넣으라고 안내</span></li>`).join('')}</ul>` : ''}`);
}

function applyChange(c) {
  const f = UI.form, meta = ST.meta;
  if (!f.date) return notify('일자를 넣어 주세요.', 'bad');
  const before = clone({people: c.people, units: c.units});
  const judge = f.judge;
  let rec = {id: uid(), kind: f.kind, date: f.date, memo: f.memo || '', at: today()};
  const unitName = no => c.units.find(u => u.no === +no)?.dept || '';
  if (['입사', '복직'].includes(f.kind)) {
    if (!f.name) return notify('이름을 넣어 주세요.', 'bad');
    const no = +(f.no || c.units[0]?.no), rate = +(f.rate || meta.gen);
    const pay = judge == null ? defJoinPay(f.date) : judge;
    let p = c.people.find(x => x.no === no && x.name === f.name);
    const a = joinAmounts(c, p ? p.a : [0, 0], f.date, rate, pay);
    if (p) p.a = a; else { p = {id: uid(), no, name: f.name, a}; c.people.push(p); }
    Object.assign(rec, {pid: p.id, name: f.name, dept: unitName(no), desc: `${a.map((v, i) => v ? [c.m1, c.m2][i] + '월' : '').filter(Boolean).join('·') || '없음'} 지급 (${rate === meta.short ? '반일제' : '전일제'})${borderline(f.date) ? ' · 담당자 판단' : ''}`, money: a.reduce((s, v) => s + v, 0)});
  } else if (['퇴사', '휴직'].includes(f.kind)) {
    const p = c.people.find(x => x.id === f.pid); if (!p) return notify('대상자를 골라 주세요.', 'bad');
    const keep = judge == null ? defLeaveKeep(f.date) : judge;
    const old = p.a.slice(); p.a = leaveAmounts(c, p.a, f.date, keep);
    const cut = old.map((v, i) => v - p.a[i]);
    Object.assign(rec, {pid: p.id, name: p.name, dept: unitName(p.no), desc: cut.some(Boolean) ? `${cut.map((v, i) => v ? [c.m1, c.m2][i] + '월' : '').filter(Boolean).join('·')} 칸 지움${borderline(f.date) ? ' · 담당자 판단' : ''}` : '바뀐 칸 없음', money: -cut.reduce((s, v) => s + v, 0)});
  } else if (f.kind === '전보') {
    const p = c.people.find(x => x.id === f.pid); if (!p) return notify('대상자를 골라 주세요.', 'bad');
    const to = +(f.no || 0); if (!to || to === p.no) return notify('옮겨 간 부서를 골라 주세요.', 'bad');
    const keep = judge == null ? defLeaveKeep(f.date) : judge;
    const rate = Math.max(...p.a);
    const oldA = p.a.slice(); p.a = leaveAmounts(c, p.a, f.date, keep);
    const nA = oldA.map((v, i) => v - p.a[i] > 0 ? rate : 0);

  const t = e.target, c = cyc();
  if (t.id === 'cycleSel') { ST.meta.cur = t.value; saveMeta(); F.length = 0; return render(); }
  if (t.id === 'rosterFile' && c) {
    const f = t.files[0]; if (!f) return;
    try {
      const r = readRoster(new Uint8Array(await f.arrayBuffer()));
      if (c.people.length && !await ask('명단 바꾸기', `<p>지금 명단을 올린 파일 내용(${r.units.length}건, ${r.people.length}명)으로 바꿉니다.</p>`, '바꾸기', true)) return;
      if (r.months[0] !== c.m1 || r.months[1] !== c.m2) notify(`파일의 달(${r.months.join('·')}월)이 회차(${c.m1}·${c.m2}월)와 다릅니다. 금액은 순서대로 넣었습니다.`, 'bad');
      const prev = Object.values(ST.cycles).filter(x => x.id < c.id && x.people.length).sort((x, y) => y.id.localeCompare(x.id))[0];
      c.units = r.units; c.people = r.people; c.fromPrev = prev?.id || null;
      if (!(r.months[0] !== c.m1 || r.months[1] !== c.m2)) notify(`명단을 읽었습니다: ${r.units.length}건 · ${r.people.length}명 · ${won(totalOf(r.people))}원`, 'ok');
      update(c);
    } catch (err) { notify('명단을 읽지 못했습니다: ' + (err.message || err), 'bad'); }
    return;
  }
  if (t.id === 'settleFile' && c) {
    const list = [...t.files];
    const dec = bytes => { const u8 = bytes instanceof Uint8Array ? bytes : new Uint8Array(typeof bytes === 'string' ? [...bytes].map(ch => ch.charCodeAt(0)) : bytes); try { return new TextDecoder('utf-8', {fatal: true}).decode(u8); } catch { return new TextDecoder('euc-kr').decode(u8); } };
    const add = async (name, bytes) => { const key = hash(name + ':' + bytes.length); if (F.some(x => x.key === key)) return; F.push({key, name, bytes, status: ST.reads[`${c.id}_${key}`] ? '읽음' : '대기', no: guessUnit(c, name)}); };
    try {
      for (const f of list) {
        if (/\.zip$/i.test(f.name)) { const z = await JSZip.loadAsync(f, {decodeFileName: dec}); for (const ent of Object.values(z.files)) { if (ent.dir || !/\.pdf$/i.test(ent.name) || /__MACOSX|\/\._/.test(ent.name)) continue; await add(ent.name.split('/').pop(), await ent.async('uint8array')); } }
        else if (/\.pdf$/i.test(f.name)) await add(f.name, new Uint8Array(await f.arrayBuffer()));
      }
      for (const x of F) if (x.pages == null) { try { const d = await pdfjsLib.getDocument({data: x.bytes.slice()}).promise; x.pages = d.numPages; await d.destroy(); } catch { x.status = '실패'; x.err = 'PDF를 열지 못함'; } }
      // 이미 읽은 파일은 영수증 보기용 그림만 만듦
      for (const x of F) if (ST.reads[`${c.id}_${x.key}`] && !pageImg[`${x.key}:1`]) await renderPages(x, 1000).catch(() => {});
      notify(`PDF ${F.length}개를 올렸습니다. [안 읽은 파일 읽기]를 누르세요.`, 'ok');
    } catch (err) { notify('파일을 열지 못했습니다: ' + (err.message || err), 'bad'); }
    return;
  }
  if (!c && !t.id.startsWith('s')) return;
  if (t.dataset.fileunit != null) { const x = F.find(f => f.key === t.dataset.fileunit); const no = t.value ? +t.value : null; x.no = no; const id = `${c.id}_${x.key}`; if (ST.reads[id]) saveRead(id, {...ST.reads[id], no}); return render(); }
  if (t.dataset.readunit != null) { const id = t.dataset.readunit; saveRead(id, {...ST.reads[id], no: t.value ? +t.value : null}); return render(); }
  if (t.dataset.p) { const p = c.people.find(x => x.id === t.dataset.p); if (t.dataset.f === 'name') p.name = t.value.trim(); else p.a[+t.dataset.f.slice(1)] = +t.value; return update(c); }
  if (t.dataset.u) { const u = c.units.find(x => x.no === UI.edit); u[t.dataset.u] = t.value.trim(); return update(c); }
  if (t.id === 'paidDate') { c.paidDate = t.value; return update(c); }
  if (t.id === 'dueDate') { c.dueDate = t.value; return update(c); }
  if (t.id === 'settleDate') { c.settleDate = t.value; return update(c); }
  if (t.id === 'cash') { c.cash = t.value; return update(c); }
  if (t.dataset.used) { const v = num(t.value); if (v == null) delete c.used[t.dataset.used]; else c.used[t.dataset.used] = v; return update(c); }
  if (t.dataset.rf) { const s = c.refunds[t.dataset.rf] ||= {}; s[t.dataset.rk] = t.value.trim(); return update(c); }
  if (t.dataset.dec) { const d = c.dec[t.dataset.dec] ||= {}; d[t.dataset.dk] = t.type === 'checkbox' ? t.checked : t.value; return update(c); }
  if (t.id?.startsWith('f')) {
    const f = UI.form;
    if (t.id === 'fKind') { UI.form = {kind: t.value, date: f.date, memo: f.memo}; return render(); }
    const map = {fPerson: 'pid', fUnit: 'no', fName: 'name', fRate: 'rate', fHolder: 'holder', fBank: 'bank', fDate: 'date', fMemo: 'memo'};
    if (t.id === 'fJudge') f.judge = t.value === '1'; else if (map[t.id]) { f[map[t.id]] = t.value; if (t.id === 'fDate') f.judge = null; }
    return render();
  }
  const m = ST.meta;
  if (t.id === 'sName') m.name = t.value.trim(); else if (t.id === 'sBiz') m.biz = t.value.trim(); else if (t.id === 'sAcct') m.acct = t.value.trim();
  else if (t.id === 'sGen') m.gen = num(t.value) || 30000; else if (t.id === 'sShort') m.short = num(t.value) || 15000;
  else if (t.id === 'sKw') m.kw = t.value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
  else return;
  saveMeta(); render();
});

// ================= 시작
(async () => {
  await load();
  if (!ST.meta.cur || !ST.cycles[ST.meta.cur]) ST.meta.cur = Object.keys(ST.cycles).sort().pop() || null;
  render();
})();
</script>
