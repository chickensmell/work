<title>부서운영비 화면 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 위 머리글(회차·설정) + 단계 표시줄(메뉴 겸 상태) + 단계별 본문. 시안 메모는 각 화면 맨 위 상자. 자녀학비보조 시안과 같은 색 체계 */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1d2330; --muted:#677084; --line:#dfe3ea; --head:#f0f2f6; --sunk:#eceef2;
  --accent:#1f5fbf; --accent-soft:#e8f0fc; --on-accent:#ffffff;
  --ok:#1e7a46; --ok-soft:#e5f4ea; --warn:#a35a00; --warn-soft:#fff3e0; --bad:#b3261e; --bad-soft:#fdeceb;
  --memo:#5b3fa8; --memo-soft:#f1edfb; --input:#fffdf3;
  --gut-l:max(20px, env(safe-area-inset-left, 0px)); --gut-r:max(20px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171d; --panel:#1c2028; --ink:#e4e8ef; --muted:#9aa3b5; --line:#323947; --head:#252a34; --sunk:#2a2f39;
  --accent:#7aa7ec; --accent-soft:#1f2c42; --on-accent:#0f1520;
  --ok:#6cc896; --ok-soft:#173025; --warn:#e8a65a; --warn-soft:#3a2a16; --bad:#f08a80; --bad-soft:#3d1d1b;
  --memo:#b9a4f0; --memo-soft:#2a2340; --input:#22262f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171d; --panel:#1c2028; --ink:#e4e8ef; --muted:#9aa3b5; --line:#323947; --head:#252a34; --sunk:#2a2f39;
  --accent:#7aa7ec; --accent-soft:#1f2c42; --on-accent:#0f1520;
  --ok:#6cc896; --ok-soft:#173025; --warn:#e8a65a; --warn-soft:#3a2a16; --bad:#f08a80; --bad-soft:#3d1d1b;
  --memo:#b9a4f0; --memo-soft:#2a2340; --input:#22262f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.55 "Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.proto{background:var(--memo);color:var(--panel);font-size:12.5px;padding:6px var(--gut-r) 6px var(--gut-l);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.proto label{display:flex;gap:6px;align-items:center;cursor:pointer}
header{background:var(--panel);border-bottom:1px solid var(--line);padding-block:10px;padding-left:var(--gut-l);padding-right:var(--gut-r);display:flex;gap:14px;align-items:center;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{font-size:16px;margin:0;letter-spacing:-.2px}
.qbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input,textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--input);color:var(--ink)}
.side{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.side button{font:inherit;border:1px solid transparent;background:none;color:var(--muted);padding:6px 10px;border-radius:6px;cursor:pointer}
.side button[aria-pressed="true"]{background:var(--sunk);color:var(--ink);font-weight:bold}
.saved{font-size:12px;color:var(--muted)}
.stepper{background:var(--panel);border-bottom:1px solid var(--line);padding-block:10px;padding-left:var(--gut-l);padding-right:var(--gut-r);display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
.stepper button{font:inherit;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;position:relative}
.stepper button:hover{border-color:var(--accent)}
.stepper button[aria-current="step"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.stepper .no{font-size:11px;color:var(--muted);letter-spacing:.3px}
.stepper .nm{font-weight:bold}
.stepper .st{font-size:12px}
.s-done .st{color:var(--ok)} .s-doing .st{color:var(--accent)} .s-warn .st{color:var(--warn)} .s-bad .st{color:var(--bad)} .s-wait .st{color:var(--muted)}
.stepper .dot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%}
.s-done .dot{background:var(--ok)} .s-doing .dot{background:var(--accent)} .s-warn .dot{background:var(--warn)} .s-bad .dot{background:var(--bad)} .s-wait .dot{background:var(--line)}
.phase{grid-column:1/-1;display:flex;gap:16px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
main{max-width:1440px;margin:0 auto;padding-block:18px 40px;padding-left:var(--gut-l);padding-right:var(--gut-r);display:flex;flex-direction:column;gap:14px}
.memo{border:1px dashed var(--memo);background:var(--memo-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:13px}
.memo b.t{color:var(--memo);display:block;margin-bottom:4px}
.memo ul{margin:0;padding-left:18px} .memo li{margin:2px 0}
body.nomemo .memo{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card h2{font-size:15px;margin:0 0 10px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card h2 .sub{font-size:12px;color:var(--muted);font-weight:normal}
.card h2 .r{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px}
.b{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:7px 12px;cursor:pointer}
.b.p{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.b.sm{padding:3px 9px;font-size:12px}
.b:focus-visible,.stepper button:focus-visible,.side button:focus-visible,.chips button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--muted)}
.tile b{display:block;font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums}
.tile.alert b{color:var(--bad)}
.todo{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.todo li{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;flex-wrap:wrap}
.todo li .what{flex:1 1 260px;min-width:0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--head);white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
tr.click{cursor:pointer} tr.click:hover td{background:var(--accent-soft)}
tr.sel td{background:var(--accent-soft)}
tr.sum td{background:var(--head);font-weight:bold}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:12px;margin:1px 2px 1px 0;white-space:nowrap}
.t-bad{background:var(--bad-soft);color:var(--bad)} .t-warn{background:var(--warn-soft);color:var(--warn)}
.t-ok{background:var(--ok-soft);color:var(--ok)} .t-info{background:var(--accent-soft);color:var(--accent)}
.t-wait{background:var(--sunk);color:var(--muted)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:14px;padding:3px 10px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.muted{color:var(--muted)}
.neg{color:var(--bad)}
.notice{padding:9px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}
.notice.bad{background:var(--bad-soft);color:var(--bad)}
.notice.ok{background:var(--ok-soft);color:var(--ok)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px;align-items:baseline}
.kv>span:nth-child(odd){color:var(--muted)}
.copybox{border:1px solid var(--line);border-radius:8px;background:var(--sunk);padding:10px 12px;white-space:pre-wrap;font-size:13px;line-height:1.7;min-width:0}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.field input,.field select{color:var(--ink);font-size:14px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted)}
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.check li{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;flex-wrap:wrap}
.mk{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:bold;flex:none}
.mk.y{background:var(--ok-soft);color:var(--ok)} .mk.n{background:var(--bad-soft);color:var(--bad)} .mk.w{background:var(--warn-soft);color:var(--warn)}
.icard{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.icard.bad{border-left-color:var(--bad)} .icard.ok{border-left-color:var(--ok)}
.icard .hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.icard .hd .amt{margin-left:auto;font-variant-numeric:tabular-nums}
.cards{display:flex;flex-direction:column;gap:8px}
.timeline{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px;margin:0;padding:0;list-style:none}
.timeline li{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;display:flex;flex-direction:column;gap:2px}
.timeline li b{font-size:13px}
.timeline li.done{border-color:var(--ok);background:var(--ok-soft)}
.timeline li.now{border-color:var(--bad);background:var(--bad-soft)}
.timeline .d{font-variant-numeric:tabular-nums;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){.stepper button{transition:border-color .15s}}
</style>

<style>
/* v2: 화면 2개(지급·정산) + 설정. 단계 표시줄 대신 탭과 한 줄 일정 */
.tabs{display:flex;gap:4px;margin-left:8px}
.tabs button{font:inherit;font-weight:bold;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:7px 18px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.flow{background:var(--panel);border-bottom:1px solid var(--line);padding-block:8px;padding-left:var(--gut-l);padding-right:var(--gut-r);display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px}
.flow span.f{padding:3px 10px;border-radius:12px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.flow span.f.done{background:var(--ok-soft);color:var(--ok)}
.flow span.f.now{background:var(--bad-soft);color:var(--bad);font-weight:bold}
.flow i{font-style:normal;color:var(--muted)}
details.sec{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
details.sec>summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"▸";color:var(--muted);width:12px}
details.sec[open]>summary::before{content:"▾"}
details.sec>summary h2{font-size:15px;margin:0}
details.sec>summary .st{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
details.sec>.in{padding:0 16px 14px;display:flex;flex-direction:column;gap:12px}
details.more>summary{cursor:pointer;color:var(--accent);font-size:13px}
.det{border:1px solid var(--accent);border-radius:10px;padding:12px 14px;background:var(--panel);display:flex;flex-direction:column;gap:10px}
.det h3{margin:0;font-size:15px}
td.hl{background:var(--bad-soft);color:var(--bad)}
td.hw{background:var(--warn-soft);color:var(--warn)}
</style>

  const x1 = a1 * P.gen + b1 * P.short, x2 = a2 * P.gen + b2 * P.short, sumF = U.reduce((s, x) => s + fin(x), 0);

  const body = `1. ${P.m1}월 지급 내역(${won(x1)}원)\n  가. 전일제: ${a1}명*30,000원= ${won(a1 * P.gen)}원\n  나. 반일제 근무 직원: ${b1}명*15,000원= ${won(b1 * P.short)}원\n2. ${P.m2}월 지급 내역(${won(x2)}원)\n  가. 전일제: ${a2}명*30,000원= ${won(a2 * P.gen)}원\n  나. 반일제 근무 직원: ${b2}명*15,000원= ${won(b2 * P.short)}원`;
  return `<details class="sec" open><summary><h2>정산 결의서 (대체결의서)</h2><span class="st">${tag('bad', `미제출 ${subNo.length} · 보완 ${cntK('보완')} 남음`)}</span></summary><div class="in">
  <div class="memo"><b class="t">시안 메모 · 정산 결의서</b><ul><li>보내 주신 9-10월 대체결의서 형식 그대로입니다. 금액은 사용액이 아니라 그 회차에 실제 지급한 금액(가지급금 → 복리후생비로 바꿈)입니다.</li><li>달별 인원은 환수·추가 지급을 반영한 최종 인원입니다(명단 변동에서 자동 계산).</li><li>지급 결의서와 달리 결의명은 "학년도"가 아니라 "${P.year}년"으로 씁니다(예시 기준).</li></ul></div>
  <div class="kv">
    <span>결의명·제목</span><span><span id="c-stitle">${esc(title)}</span> ${copyBtn('c-stitle')}</span>
    <span>금액</span><span>${won(x1 + x2)}원 ${x1 + x2 === sumF ? tag('ok', '확정 지급액 합과 같음') : tag('bad', '확정 지급액 합과 다름')}</span>
    <span>차변</span><span>관리운영비 · 운영비 · 복리후생비 · 복리후생비-일반 <span class="muted">(사업실행계획 ${P.year}학년도 부서운영(단합)비 지급 건)</span></span>
    <span>대변</span><span>유동자산 · 기타유동자산 · 가지급금</span>
    <span>결의내역</span><span><span class="copybox" id="c-sbody" style="display:inline-block">${esc(body)}</span> ${copyBtn('c-sbody')}</span>
  </div>
  <div class="row"><button class="b" type="button">명단(정산 사용액 포함) 엑셀 받기</button><button class="b" type="button">검토 결과 보고서 보기</button></div>
</div></details>`;
}

V.set = () => `
<div class="grid2">
  <div class="card"><h2>기본 값 <span class="sub">앱 저장소(본인만)에만 저장</span></h2><div class="kv">
    <span>담당자 이름</span><span><input id="setName" placeholder="메일 서명"></span>
    <span>학교 사업자번호</span><span><input id="setBiz" placeholder="식별번호 대조"></span>
    <span>환수 입금 계좌</span><span><input id="setAcct" placeholder="은행 계좌번호"></span>
    <span>월 단가</span><span>일반 ${won(P.gen)}원 · 단기 ${won(P.short)}원</span>
  </div></div>
  <div class="card"><h2>용도 확인 단어</h2><p style="margin:0">꽃 · 비품 · 상품권 · 선물 · 포인트 · 충전기 · 키보드 · 의류 · 식재료 · 주유비 · 화장품 · 장난감</p></div>

function render() {
  document.getElementById('tabs').innerHTML = [['pay', '지급'], ['settle', '정산']].map(([k, n]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${tab === k}">${n}</button>`).join('');
  document.getElementById('sideSet').setAttribute('aria-pressed', String(tab === 'set'));
  document.getElementById('flow').innerHTML = flow();
  document.getElementById('main').innerHTML = V[tab]();
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]');
  if (t) { tab = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const r = e.target.closest('[data-unit]');
  if (r) { sel = +r.dataset.unit; render(); document.querySelector('.det')?.scrollIntoView({block:'nearest'}); return; }
  const c = e.target.closest('[data-copy]');
  if (c) {
    const el = document.getElementById(c.dataset.copy);
    const done = () => { c.textContent = '복사됨'; setTimeout(() => { c.textContent = '복사'; }, 1500); };
    const pick = () => { const s = getSelection(), rg = document.createRange(); rg.selectNodeContents(el); s.removeAllRanges(); s.addRange(rg); c.textContent = '선택됨 · Ctrl+C'; };
    try { navigator.clipboard.writeText(el.innerText).then(done, pick); } catch { pick(); }
    return;
  }
  const chip = e.target.closest('.chips button');
  if (chip) chip.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === chip)));
});
document.getElementById('memoToggle').addEventListener('change', e => document.body.classList.toggle('nomemo', !e.target.checked));
render();
</script>
