<title>나의 업무 보드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 상단 머리글(제목·화면 탭) + 빠른 추가, 아래에 세 화면. 현황판 = 요약 타일 + 오늘 할 일 칸반 + 다가오는 마감·분류별 현황, 캘린더 = 월간 달력 + 선택한 날·마감일 미정, 목록 = 보기·분류 사이드바 + 주기별 묶음 목록. 업무를 누르면 오른쪽 편집 패널. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunk:#e9edf2; --line:#d9dfe7;
  --fg:#1b2533; --muted:#5d6b7d; --accent:#1f4f8f; --accent-soft:#e3ecf8; --on-accent:#ffffff;
  --red:#b4372f; --red-soft:#fbe9e7; --amber:#9a6200; --amber-soft:#fdf1d8; --green:#2f7a4b; --green-soft:#e2f2e7; --grey-soft:#eceff3;
  --sat:#2f5fb3; --shadow:rgba(20,32,50,.08);
  --c-welfare:#2f7a6e; --c-edu:#6a4fb0; --c-doc:#a2562a; --c-routine:#4b6584;
  --font-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#18202a; --sunk:#202a36; --line:#2c3846;
  --fg:#e3e9f1; --muted:#97a5b6; --accent:#7fa9e3; --accent-soft:#1f3047; --on-accent:#0d1520;
  --red:#ee8a80; --red-soft:#3a1f1d; --amber:#e6b45a; --amber-soft:#3a2d14; --green:#7cc796; --green-soft:#183323; --grey-soft:#242e3a;
  --sat:#8fb0ec; --shadow:rgba(0,0,0,.35);
  --c-welfare:#6cc2b4; --c-edu:#ab95e8; --c-doc:#e09a6c; --c-routine:#93abc9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --surface:#18202a; --sunk:#202a36; --line:#2c3846;
  --fg:#e3e9f1; --muted:#97a5b6; --accent:#7fa9e3; --accent-soft:#1f3047; --on-accent:#0d1520;
  --red:#ee8a80; --red-soft:#3a1f1d; --amber:#e6b45a; --amber-soft:#3a2d14; --green:#7cc796; --green-soft:#183323; --grey-soft:#242e3a;
  --sat:#8fb0ec; --shadow:rgba(0,0,0,.35);
  --c-welfare:#6cc2b4; --c-edu:#ab95e8; --c-doc:#e09a6c; --c-routine:#93abc9; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;word-break:keep-all}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;gap:16px;max-width:1320px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-size:20px;margin:0;letter-spacing:-.01em}
.brand .today{color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px}
.tabs button{border:0;background:none;padding:6px 18px;border-radius:7px;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px var(--shadow)}
/* common */
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.lbl{display:flex;align-items:center;gap:8px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;padding:11px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ph h2{font-size:15.5px;margin:0}
.ph .sub{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.ph .ttl{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 9px;font-size:12px;white-space:nowrap}
.mini[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 11px;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.seg.sm button{padding:3px 10px;font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;background:var(--grey-soft);font-size:12px;white-space:nowrap}
.chip.doing{background:var(--accent-soft);color:var(--accent)}
.chip.hold{background:var(--amber-soft);color:var(--amber)}
.chip.done{background:var(--green-soft);color:var(--green)}
.chip.sample{border:1px dashed var(--muted);background:none}
.chip .dot{width:7px;height:7px}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.pri-high{color:var(--red);font-weight:600}
.dday{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.dday.over{color:var(--red)} .dday.near{color:var(--amber)}
.bar{width:72px;height:5px;border-radius:3px;background:var(--sunk);overflow:hidden;display:inline-block}
.bar i{display:block;height:100%;background:var(--accent)}
.check{width:22px;height:22px;border:2px solid var(--muted);border-radius:6px;background:none;display:grid;place-items:center;padding:0;flex:none}
.check[aria-checked="true"]{background:var(--green);border-color:var(--green)}
.check svg{width:14px;height:14px;fill:none;stroke:var(--surface);stroke-width:3}
.check.sm{width:18px;height:18px;border-radius:5px;margin-top:2px}
.check.sm svg{width:11px;height:11px}
.notice{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 12px}
.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--fg);margin-bottom:4px}
/* quick add */
.quick{display:flex;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.quick input[type=text]{flex:1 1 260px;min-width:0;border:0;background:none;padding:6px 8px;font-size:15px}
.quick input[type=text]:focus{outline:none}
.quick select,.quick input[type=date]{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;font-size:14px;min-width:0}
/* board */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.tile:hover{border-color:var(--accent)}
.tile .k{font-size:12.5px;color:var(--muted)}
.tile .v{font-family:var(--font-num);font-size:26px;line-height:1.2}
.tile .v small{font-family:var(--font-body);font-size:13px;color:var(--muted);margin-left:3px}
.tile.warn .v{color:var(--red)}
.board{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.kan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:12px}
.col{background:var(--sunk);border-radius:9px;display:flex;flex-direction:column;min-width:0}
.colh{display:flex;justify-content:space-between;align-items:center;padding:9px 11px 5px;font-size:13px;font-weight:600}
.colh .cnt{font-family:var(--font-num);font-size:12px;color:var(--muted);font-weight:500}
.zone{display:flex;flex-direction:column;gap:8px;padding:4px 7px 9px;min-height:150px;flex:1;border-radius:9px;border:1.5px dashed transparent}
.zone.over{border-color:var(--accent);background:var(--accent-soft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;display:flex;flex-direction:column;gap:7px;cursor:pointer;box-shadow:0 1px 1px var(--shadow)}
.card:hover{border-color:var(--accent)}
.card.dragging{opacity:.4}
.card .ct{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start}
.card .title{font-weight:500;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.card.done .title{text-decoration:line-through;color:var(--muted)}
.card .cf{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.card .cfr{display:flex;align-items:center;gap:8px}
.card .bar{width:48px}
.zone .hint{font-size:12.5px;color:var(--muted);text-align:center;padding:18px 6px;line-height:1.55}
.ups{display:flex;flex-direction:column}
.up{display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);font-size:13.5px}
.up:first-child{border-top:0}
.up .nm{min-width:0;cursor:pointer;display:flex;flex-direction:column;gap:1px;border:0;background:none;padding:0;text-align:left}
.up .nm span:first-child{overflow-wrap:anywhere}
.up .nm small{color:var(--muted);font-size:12px}
.upfoot{padding:9px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;font-size:12.5px;font-weight:600}
.catrow{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 14px;font-size:13.5px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.catrow:first-child{border-top:0}
.catrow:hover{background:var(--sunk)}
.cbar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.cbar i{display:block;height:100%}
.catrow .cn{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
/* calendar */
.calwrap{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px;align-items:start}
.calwrap>.panel{overflow:hidden}
.calh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line)}
.calh h2{font-size:17px;margin:0 4px;font-variant-numeric:tabular-nums;min-width:112px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:32px;height:32px;display:grid;place-items:center;padding:0}
.icon-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
.legend{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.legend button{border:0;background:none;border-radius:6px;padding:3px 8px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.legend button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);text-align:center}
.wk span{padding:6px 0}
.wk span:nth-child(6){color:var(--sat)} .wk span:nth-child(7){color:var(--red)}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.day{min-height:112px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 4px 6px;display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer;background:var(--surface)}
.day:nth-child(7n){border-right:0}
.mgrid .day:nth-last-child(-n+7){border-bottom:0}
.day.out{background:var(--bg)}
.day.out .dn{opacity:.5}
.day:hover{background:var(--sunk)}
.day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.day.over{background:var(--accent-soft)}
.dn{font-size:12.5px;font-family:var(--font-num);min-width:24px;height:24px;display:grid;place-items:center;border-radius:12px;align-self:flex-start;padding:0 4px}
.day.sun .dn{color:var(--red)} .day.sat .dn{color:var(--sat)}
.day.today .dn{background:var(--accent);color:var(--on-accent)}
.ev{display:flex;align-items:center;gap:5px;font-size:12px;line-height:1.35;padding:2px 6px;border-radius:5px;background:var(--grey-soft);white-space:nowrap;overflow:hidden;min-width:0;border:0;text-align:left;width:100%;color:var(--fg)}
.ev .dot{width:7px;height:7px}
.ev .tx{overflow:hidden;text-overflow:ellipsis}
.ev.overdue{background:var(--red-soft);color:var(--red)}
.ev.done{color:var(--muted);background:none}
.ev.done .tx{text-decoration:line-through}
.ev.hold{background:var(--amber-soft)}
.ev.ghost{background:none;border:1px dashed var(--line);color:var(--muted)}
.ev[draggable="true"]{cursor:grab}
.more{font-size:11.5px;color:var(--muted);padding-left:6px}
.dots{display:none;gap:3px;flex-wrap:wrap;padding-left:3px}
.dots .dot{width:6px;height:6px}
.ag-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:9px 14px;border-top:1px solid var(--line);cursor:pointer}
.ag-item:first-child{border-top:0}
.ag-item:hover{background:var(--sunk)}
.ag-item .title{font-size:14px;font-weight:500;overflow-wrap:anywhere}
.ag-item.done .title{text-decoration:line-through;color:var(--muted)}
.ag-item.ghost{color:var(--muted)}
.ag-item .gh{width:18px;height:18px;border:1.5px dashed var(--line);border-radius:5px;margin-top:2px}
.ag-item[draggable="true"]{cursor:grab}
.agadd{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--line)}
.agadd input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;font-size:14px}
.scroll{max-height:420px;overflow:auto}
/* list */
.listwrap{display:grid;grid-template-columns:210px minmax(0,1fr);gap:24px;align-items:start}
.lside{display:flex;flex-direction:column;gap:20px;position:sticky;top:max(16px,env(safe-area-inset-top,0px))}
.nav-label{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.08em;margin:0 0 6px 10px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;justify-content:space-between;border:0;background:none;padding:7px 10px;border-radius:8px;text-align:left;color:var(--fg)}
.nav button:hover{background:var(--sunk)}
.nav button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .cnt{font-family:var(--font-num);font-size:12px;color:var(--muted)}
.lmain{min-width:0;display:flex;flex-direction:column;gap:12px}
.listhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.listhead h2{font-size:17px;margin:0}
.listhead .sub{color:var(--muted);font-size:13px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.sec{display:flex;justify-content:space-between;align-items:center;padding:7px 14px;background:var(--sunk);border-top:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.sec:first-child{border-top:0}
.sec .cnt{font-weight:400}
.row.sub{padding-left:48px;position:relative;border-top-style:dashed}
.row.sub::before{content:"";position:absolute;left:24px;top:0;bottom:50%;width:12px;border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);border-bottom-left-radius:6px}
.row .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.row .title{font-weight:500;overflow-wrap:anywhere}
.row.done .title{text-decoration:line-through;color:var(--muted)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,15,22,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:21;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dhead h3{margin:0;font-size:15px}
.dbody{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.fl,.fl{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input[type=text],.field input[type=date],.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.field textarea{min-height:80px;resize:vertical}
.field textarea#f-memo{min-height:140px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prog{display:flex;align-items:center;gap:10px}
.prog input{flex:1;accent-color:var(--accent)}
.prog output{font-family:var(--font-num);width:44px;text-align:right}
.logs,.steps{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.logs li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;font-size:13.5px;background:var(--bg);border-radius:8px;padding:6px 10px;align-items:start}
.logs time{font-family:var(--font-num);font-size:12px;color:var(--muted);padding-top:2px}
.logs .x,.steps .x{border:0;background:none;color:var(--muted);padding:0 2px}
.steps li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;font-size:13.5px;background:var(--bg);border-radius:8px;padding:7px 10px}
.steps li.on span{color:var(--muted);text-decoration:line-through}
.steps .check{width:18px;height:18px;border-width:2px;border-radius:5px}
.steps .check svg{width:11px;height:11px}
.logadd{display:flex;gap:6px}
.logadd input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px}
.dfoot{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.dfoot .grp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.confirm{font-size:13px;color:var(--red)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (max-width:1100px){
  .board,.calwrap{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:820px){
  .app{padding-block:14px 40px;gap:14px}
  .tabs{width:100%}
  .tabs button{flex:1;padding:7px 8px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kan{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:82%;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px}
  .col{scroll-snap-align:start}
  .listwrap{grid-template-columns:minmax(0,1fr);gap:12px}
  .lside{position:static;gap:10px}
  .navwrap{overflow-x:auto;margin:0 -4px}
  .nav{flex-direction:row;gap:6px;padding:0 4px}
  .nav button{white-space:nowrap;border:1px solid var(--line);background:var(--surface)}
  .nav-label{display:none}
  .bar{width:56px}
  .day{min-height:60px;padding:3px 2px 5px}
  .day .ev,.day .more{display:none}
  .dots{display:flex}

<script>
(function(){
const CATS=[{id:'welfare',name:'복지',color:'var(--c-welfare)'},{id:'edu',name:'교육',color:'var(--c-edu)'},{id:'doc',name:'정산·청구',color:'var(--c-doc)'},{id:'routine',name:'상시업무',color:'var(--c-routine)'}];
const STATUS={todo:'대기',doing:'진행중',hold:'보류',done:'완료'};
const PRI={high:'높음',mid:'보통',low:'낮음'};
const REPEAT={'':'반복 안 함',weekly:'매주',monthly:'매월',bimonthly:'2개월마다',quarterly:'분기별',semester:'매학기(6개월)',yearly:'매년'};
const REP_MONTHS={monthly:1,bimonthly:2,quarterly:3,semester:6,yearly:12};
const FREQ_ORDER=['weekly','monthly','bimonthly','','quarterly','semester','yearly'];
const FREQ_LABEL={weekly:'매주',monthly:'매월',bimonthly:'2개월마다','':'수시',quarterly:'분기별',semester:'학기별',yearly:'연 단위'};
const freqRank=r=>{const i=FREQ_ORDER.indexOf(r||'');return i<0?3:i};
const VIEWS=[{id:'all',name:'진행 업무 전체'},{id:'today',name:'오늘 할 일'},{id:'week',name:'이번 주'},{id:'soon',name:'마감 임박(3일)'},{id:'hold',name:'보류'},{id:'done',name:'완료'}];
const TABS=[{id:'board',name:'현황판'},{id:'calendar',name:'캘린더'},{id:'list',name:'목록'}];
const COLS=[{id:'todo',name:'대기',color:'var(--muted)'},{id:'doing',name:'진행중',color:'var(--accent)'},{id:'hold',name:'보류',color:'var(--amber)'},{id:'done',name:'완료',color:'var(--green)'}];
const SCOPES=[{id:'today',name:'오늘'},{id:'week',name:'이번 주'},{id:'all',name:'전체'}];
const CHECK_SVG='<svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
const $=s=>document.querySelector(s);
const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(k,v===true?'':v)}for(const c of kids.flat()){if(c!=null)e.append(c)}return e};
const catOf=id=>CATS.find(c=>c.id===id);
const catColor=id=>(catOf(id)||{color:'var(--muted)'}).color;
const catIdx=id=>{const i=CATS.findIndex(c=>c.id===id);return i<0?99:i};

/* dates */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const todayStr=()=>ymd(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const addMonths=(s,n)=>{const d=parse(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return ymd(d)};
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const WD='일월화수목금토';
const fmtK=s=>{const d=parse(s);return d.getFullYear()+'. '+(d.getMonth()+1)+'. '+d.getDate()+'.('+WD[d.getDay()]+')'};
const fmtShort=s=>{const d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')'};
const weekEnd=()=>{const d=new Date();const wd=d.getDay();d.setDate(d.getDate()+(wd===0?0:7-wd));return ymd(d)};
const weekStart=()=>{const d=new Date();const wd=d.getDay();d.setDate(d.getDate()-(wd===0?6:wd-1));return ymd(d)};
const isoDay=iso=>{if(!iso)return'';const d=new Date(iso);return isNaN(d)?'':ymd(d)};
function nextDue(s,rep){const base=s||todayStr();switch(rep){case'weekly':return addDays(base,7);case'monthly':return addMonths(base,1);case'bimonthly':return addMonths(base,2);case'quarterly':return addMonths(base,3);case'semester':return addMonths(base,6);case'yearly':return addMonths(base,12);default:return''}}
function nthDue(s,rep,k){return rep==='weekly'?addDays(s,7*k):REP_MONTHS[rep]?addMonths(s,REP_MONTHS[rep]*k):''}

/* state */
let tasks=[],view='all',cat='',scope='today',loaded=false,store=null,openId=null,dragId=null;
let calM=todayStr().slice(0,7),selDate=todayStr();
try{const v=localStorage.getItem('wb-view');if(v&&VIEWS.some(x=>x.id===v))view=v;const s=localStorage.getItem('wb-scope');if(s&&SCOPES.some(x=>x.id===s))scope=s}catch(e){}
const readHash=()=>{const h=(location.hash||'').slice(1);return TABS.some(t=>t.id===h)?h:null};
let tab=readHash()||'board';
window.addEventListener('hashchange',()=>{const h=readHash();if(h&&h!==tab){tab=h;render()}});
function go(t){tab=t;try{if(location.hash.slice(1)!==t)location.hash=t}catch(e){}render();window.scrollTo({top:0})}
const remember=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

/* store: db when available, else this browser only */
function localStore(){
  const KEY='wb-local-tasks';let data={};let cb=null;
  try{data=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){};emit()};
  const emit=()=>cb&&cb(Object.entries(data).map(([id,d])=>({id,...d})));
  return{kind:'local',subscribe(f){cb=f;setTimeout(emit,0)},async set(id,d){data[id]=d;save()},async add(d){const id='t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);data[id]=d;save();return id},async del(id){delete data[id];save()}};
}
function dbStore(db){
  const col=db.collection('tasks');
  return{kind:'db',subscribe(f,err){return col.onSnapshot(s=>f(s.docs.map(d=>({id:d.id,...d.data()})),s.metadata),err)},
    async set(id,d){await col.doc(id).set(d)},async add(d){const r=await col.add(d);return r.id},async del(id){await col.doc(id).delete()}};
}
function showNotice(t){const n=$('#notice');n.textContent=t||'';n.hidden=!t}
function toast(t){const e=el('div',{class:'toast',role:'status',text:t});document.body.append(e);setTimeout(()=>e.remove(),1900)}

async function start(){
  let db=null;
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  if(db){
    store=dbStore(db);
    const timer=setTimeout(()=>{if(!loaded)showNotice('저장소에 아직 연결되지 않았습니다. 잠시 후 자동으로 다시 시도합니다.')},10000);
    store.subscribe((list,meta)=>{tasks=list;if(!meta||!meta.fromCache){loaded=true;clearTimeout(timer);showNotice('')}render()},
      e=>{clearTimeout(timer);loaded=true;showNotice('저장소 연결이 끊겼습니다. 페이지를 새로 열어 주세요. ('+e.code+')');render()});
  }else{
    store=localStore();
    showNotice('지금은 이 브라우저에만 저장되는 모드입니다. claude.ai에서 열면 PC와 휴대폰이 같은 목록을 봅니다.');
    store.subscribe(list=>{tasks=list;loaded=true;render()});
  }
}

/* derived */
const isOpen=t=>t.status!=='done';
function dueInfo(t){
  if(!t.due)return null;const n=diffDays(t.due,todayStr());
  if(t.status==='done')return{txt:fmtShort(t.due),cls:''};
  if(n<0)return{txt:(-n)+'일 지남',cls:'over'};
  if(n===0)return{txt:'D-day',cls:'over'};
  return{txt:'D-'+n,cls:n<=3?'near':''};
}
function inView(t,v){
  const td=todayStr();
  switch(v){
    case'all':return t.status!=='done'&&t.status!=='hold';
    case'today':return isOpen(t)&&t.status!=='hold'&&(t.due&&t.due<=td||t.status==='doing'&&!t.due);
    case'week':return isOpen(t)&&t.status!=='hold'&&t.due&&t.due<=weekEnd();
    case'soon':return isOpen(t)&&t.status!=='hold'&&t.due&&t.due<=addDays(td,3);
    case'hold':return t.status==='hold';
    case'done':return t.status==='done';
  }return true;
}
/* 칸반 범위: 진행중은 항상, 대기·보류는 마감일 또는 '오늘 할 일' 지정 기준, 완료는 완료일 기준 */
function inScope(t,sc){
  const td=todayStr();
  if(t.status==='done'){const d=isoDay(t.doneAt);if(!d)return false;return sc==='today'?d===td:sc==='week'?d>=weekStart():d>=addDays(td,-7)}
  if(t.status==='doing')return true;
  if(sc==='all')return true;
  if(t.focus===td)return true;
  return !!t.due&&t.due<=(sc==='today'?td:weekEnd());
}
const priRank={high:0,mid:1,low:2};
const byDue=(a,b)=>{const da=a.due||'9999',db=b.due||'9999';if(da!==db)return da<db?-1:1;if(priRank[a.pri]!==priRank[b.pri])return (priRank[a.pri]??1)-(priRank[b.pri]??1);return (a.createdAt||'').localeCompare(b.createdAt||'')};
function sortTasks(a,b){if(view==='done')return (b.doneAt||'').localeCompare(a.doneAt||'');return byDue(a,b)}

/* shared bits */
function checkBtn(t,small){
  const done=t.status==='done';
  const b=el('button',{type:'button',class:'check'+(small?' sm':''),role:'checkbox','aria-checked':String(done),'aria-label':done?'완료 취소':'완료로 표시',onclick:e=>{e.stopPropagation();toggleDone(t)}});
  b.innerHTML=CHECK_SVG;return b;
}
function catChip(t){const c=catOf(t.cat);return c?el('span',{class:'chip'},el('span',{class:'dot',style:'background:'+c.color}),c.name):null}
function dragSrc(node,id){
  node.setAttribute('draggable','true');
  node.addEventListener('dragstart',e=>{dragId=id;try{e.dataTransfer.setData('text/plain',id);e.dataTransfer.effectAllowed='move'}catch(x){}node.classList.add('dragging')});
  node.addEventListener('dragend',()=>{dragId=null;node.classList.remove('dragging')});
}
function dropZone(node,fn){
  node.addEventListener('dragover',e=>{if(!dragId)return;e.preventDefault();node.classList.add('over')});
  node.addEventListener('dragleave',e=>{if(!node.contains(e.relatedTarget))node.classList.remove('over')});
  node.addEventListener('drop',e=>{e.preventDefault();node.classList.remove('over');const id=dragId||e.dataTransfer.getData('text/plain');dragId=null;if(id)fn(id)});
}

/* render */
function render(){
  $('#today').textContent=fmtK(todayStr());
  $('#tabs').replaceChildren(...TABS.map(t=>el('button',{type:'button',role:'tab','aria-selected':String(tab===t.id),onclick:()=>go(t.id)},t.name)));
  for(const t of TABS)$('#tab-'+t.id).hidden=tab!==t.id;
  if(tab==='board')renderBoard();else if(tab==='calendar')renderCal();else renderList();
}

/* 현황판 */
function renderBoard(){
  const td=todayStr(),month=td.slice(0,7);
  const doing=tasks.filter(t=>t.status==='doing').length;
  const overdue=tasks.filter(t=>isOpen(t)&&t.status!=='hold'&&t.due&&t.due<td).length;
  const todayDue=tasks.filter(t=>inView(t,'today')).length;
  const weekDue=tasks.filter(t=>inView(t,'week')).length;
  const doneMonth=tasks.filter(t=>t.status==='done'&&isoDay(t.doneAt).slice(0,7)===month).length;
  const tile=(k,v,unit,goView,warn)=>el('button',{type:'button',class:'tile'+(warn?' warn':''),onclick:()=>{view=goView;cat='';remember('wb-view',view);go('list')}},el('span',{class:'k',text:k}),el('span',{class:'v'},loaded?String(v):'–',el('small',{text:unit})));
  $('#tiles').replaceChildren(
    tile('진행 중',doing,'건','all'),
    tile(overdue?'오늘까지 · 지연 '+overdue+'건':'오늘까지 마감',todayDue,'건','today',overdue>0),
    tile('이번 주 마감',weekDue,'건','week'),
    tile((parse(td).getMonth()+1)+'월 완료',doneMonth,'건','done'));
  $('#scope').replaceChildren(...SCOPES.map(s=>el('button',{type:'button','aria-pressed':String(scope===s.id),onclick:()=>{scope=s.id;remember('wb-scope',scope);render()}},s.name)));
  $('#kan-title').textContent=scope==='today'?'오늘 할 일':scope==='week'?'이번 주 할 일':'전체 업무';
  $('#kan-sub').textContent=scope==='today'?fmtK(td):scope==='week'?fmtShort(weekStart())+' ~ '+fmtShort(weekEnd()):'완료는 최근 7일';
  const items=loaded?tasks.filter(t=>inScope(t,scope)):[];
  const hint=id=>!loaded?'불러오는 중입니다':id==='todo'?(scope==='all'?'대기 중인 업무가 없습니다.':'이 기간에 마감인 대기 업무가 없습니다. 오른쪽 ‘다가오는 마감’에서 [오늘]을 누르면 여기로 옵니다.'):id==='doing'?'진행 중인 업무가 없습니다. 카드를 여기로 끌어 오면 진행중이 됩니다.':id==='hold'?'보류한 업무가 없습니다.':'완료한 업무가 여기에 쌓입니다.';
  $('#kan').replaceChildren(...COLS.map(c=>{
    const list=items.filter(t=>t.status===c.id).sort(c.id==='done'?(a,b)=>(b.doneAt||'').localeCompare(a.doneAt||''):byDue);
    const zone=el('div',{class:'zone'},...(list.length?list.map(cardEl):[el('div',{class:'hint',text:hint(c.id)})]));
    dropZone(zone,id=>{const t=tasks.find(x=>x.id===id);if(t)setStatus(t,c.id)});
    return el('div',{class:'col'},el('div',{class:'colh'},el('span',{class:'lbl'},el('span',{class:'dot',style:'background:'+c.color}),c.name),el('span',{class:'cnt',text:String(list.length)})),zone);
  }));
  // 다가오는 마감
  const lim=addDays(td,14);
  const ups=tasks.filter(t=>isOpen(t)&&t.status!=='hold'&&t.status!=='doing'&&t.due&&t.due>td&&t.due<=lim).sort(byDue);
  const ul=$('#ups');
  if(!loaded){ul.replaceChildren(el('div',{class:'empty',text:'업무를 불러오는 중입니다'}))}
  else if(!ups.length){ul.replaceChildren(el('div',{class:'empty',text:'앞으로 2주 안에 마감인 업무가 없습니다.'}))}
  else ul.replaceChildren(...ups.map(t=>{const di=dueInfo(t);const on=t.focus===td;
    return el('div',{class:'up'},el('span',{class:'dday '+di.cls,text:di.txt}),
      el('button',{type:'button',class:'nm',onclick:()=>openDrawer(t.id)},el('span',{text:t.title}),el('small',{text:fmtShort(t.due)+' · '+(catOf(t.cat)||{name:''}).name})),
      el('button',{type:'button',class:'mini','aria-pressed':String(on),title:on?'오늘 할 일에서 빼기':'오늘 할 일로 가져오기',onclick:()=>toggleFocus(t)},on?'오늘 ✓':'오늘'))}));
  const nodue=tasks.filter(t=>isOpen(t)&&!t.due&&t.status!=='hold').length;
  $('#upfoot').replaceChildren(el('span',{text:loaded?'마감일 미정 업무 '+nodue+'건':''}),loaded&&nodue?el('button',{type:'button',class:'linkbtn',onclick:()=>go('calendar')},'캘린더에서 날짜 정하기'):null);
  // 분류별 현황
  $('#catstats').replaceChildren(...CATS.map(c=>{
    const open=tasks.filter(t=>t.cat===c.id&&isOpen(t));
    const avg=open.length?Math.round(open.reduce((s,t)=>s+(Number(t.progress)||0),0)/open.length):0;
    const dg=open.filter(t=>t.status==='doing').length;
    return el('button',{type:'button',class:'catrow',title:c.name+' 목록 보기',onclick:()=>{cat=c.id;view='all';remember('wb-view',view);go('list')}},
      el('span',{class:'lbl'},el('span',{class:'dot',style:'background:'+c.color}),c.name),
      el('span',{class:'cbar',title:'평균 진행률 '+avg+'%'},el('i',{style:'width:'+avg+'%;background:'+c.color})),
      el('span',{class:'cn',text:loaded?open.length+'건'+(dg?' · 진행 '+dg:'')+' · '+avg+'%':''}));
  }));
}
function cardEl(t){

    if(d.status==='done'&&!wasDone&&d.repeat){const{nd,data}=nextCopy(d);await safe(store.add(data),'다음 반복 업무를 '+fmtShort(nd)+' 마감으로 만들었습니다')}
  };
  const askDel=()=>{confirmBox.replaceChildren(el('span',{class:'confirm',text:'삭제할까요?'}),el('button',{type:'button',class:'btn danger',onclick:async()=>{close();await safe(store.del(id),'삭제했습니다')}},'삭제'),el('button',{type:'button',class:'btn',onclick:()=>confirmBox.replaceChildren(delBtn)},'취소'))};
  const delBtn=el('button',{type:'button',class:'btn danger',onclick:askDel},'업무 삭제');confirmBox.append(delBtn);

        el('div',{class:'field'},el('label',{for:'f-grp',text:'업무 묶음 (같은 이름끼리 목록에서 함께 표시)'}),grp,dl),
        el('div',{class:'field'},el('span',{class:'fl',text:'상태'}),seg('status',STATUS)),
        el('div',{class:'field'},el('label',{for:'f-prog',text:'진행률'}),el('div',{class:'prog'},range,out),progNote),
        el('div',{class:'field'},el('label',{for:'f-step',text:'처리 절차'}),stepList,el('div',{class:'logadd'},stepIn,el('button',{type:'button',class:'btn',onclick:addStep},'절차 추가'))),
        el('div',{class:'two'},el('div',{class:'field'},el('span',{class:'fl',text:'우선순위'}),seg('pri',PRI)),el('div',{class:'field'},el('label',{for:'f-rep',text:'반복'}),rep)),
        el('div',{class:'field'},el('label',{for:'f-memo',text:'메모'}),memo),
        el('div',{class:'field'},el('label',{for:'f-log',text:'진행 기록'}),el('div',{class:'logadd'},logIn,el('button',{type:'button',class:'btn',onclick:addLog},'기록 추가')),logList)),
      el('div',{class:'dfoot'},confirmBox,el('div',{class:'grp'},el('button',{type:'button',class:'btn',onclick:close},'취소'),el('button',{type:'button',class:'btn primary',onclick:save},'저장')))));
  syncProg();title.focus();
