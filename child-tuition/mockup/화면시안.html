<title>자녀학비보조 화면 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 위 머리글(분기·별도 메뉴) + 단계 표시줄(메뉴 겸 상태) + 단계별 본문. 시안 메모는 각 화면 맨 위 접이식 상자. 실제 앱과 같은 색 체계 */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1d2330; --muted:#677084; --line:#dfe3ea; --head:#f0f2f6; --sunk:#eceef2;
  --accent:#1f5fbf; --accent-soft:#e8f0fc; --on-accent:#ffffff;
  --ok:#1e7a46; --ok-soft:#e5f4ea; --warn:#a35a00; --warn-soft:#fff3e0; --bad:#b3261e; --bad-soft:#fdeceb;
  --memo:#5b3fa8; --memo-soft:#f1edfb; --input:#fffdf3;
  --gut-l:max(20px, env(safe-area-inset-left, 0px)); --gut-r:max(20px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171d; --panel:#1c2028; --ink:#e4e8ef; --muted:#9aa3b5; --line:#323947; --head:#252a34; --sunk:#2a2f39;
  --accent:#7aa7ec; --accent-soft:#1f2c42; --on-accent:#0f1520;
  --ok:#6cc896; --ok-soft:#173025; --warn:#e8a65a; --warn-soft:#3a2a16; --bad:#f08a80; --bad-soft:#3d1d1b;
  --memo:#b9a4f0; --memo-soft:#2a2340; --input:#22262f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171d; --panel:#1c2028; --ink:#e4e8ef; --muted:#9aa3b5; --line:#323947; --head:#252a34; --sunk:#2a2f39;
  --accent:#7aa7ec; --accent-soft:#1f2c42; --on-accent:#0f1520;
  --ok:#6cc896; --ok-soft:#173025; --warn:#e8a65a; --warn-soft:#3a2a16; --bad:#f08a80; --bad-soft:#3d1d1b;
  --memo:#b9a4f0; --memo-soft:#2a2340; --input:#22262f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.55 "Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.proto{background:var(--memo);color:var(--panel);font-size:12.5px;padding:6px var(--gut-r) 6px var(--gut-l);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.proto label{display:flex;gap:6px;align-items:center;cursor:pointer}
header{background:var(--panel);border-bottom:1px solid var(--line);padding-block:10px;padding-left:var(--gut-l);padding-right:var(--gut-r);display:flex;gap:14px;align-items:center;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{font-size:16px;margin:0;letter-spacing:-.2px}
.qbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input,textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--input);color:var(--ink)}
.side{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.side button{font:inherit;border:1px solid transparent;background:none;color:var(--muted);padding:6px 10px;border-radius:6px;cursor:pointer}
.side button[aria-pressed="true"]{background:var(--sunk);color:var(--ink);font-weight:bold}
.saved{font-size:12px;color:var(--muted)}
/* 단계 표시줄 */
.stepper{background:var(--panel);border-bottom:1px solid var(--line);padding-block:10px;padding-left:var(--gut-l);padding-right:var(--gut-r);display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:6px}
.stepper button{font:inherit;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;position:relative}
.stepper button:hover{border-color:var(--accent)}
.stepper button[aria-current="step"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.stepper .no{font-size:11px;color:var(--muted);letter-spacing:.3px}
.stepper .nm{font-weight:bold}
.stepper .st{font-size:12px}
.s-done .st{color:var(--ok)} .s-doing .st{color:var(--accent)} .s-warn .st{color:var(--warn)} .s-bad .st{color:var(--bad)} .s-wait .st{color:var(--muted)}
.stepper .dot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%}
.s-done .dot{background:var(--ok)} .s-doing .dot{background:var(--accent)} .s-warn .dot{background:var(--warn)} .s-bad .dot{background:var(--bad)} .s-wait .dot{background:var(--line)}
main{max-width:1440px;margin:0 auto;padding-block:18px 40px;padding-left:var(--gut-l);padding-right:var(--gut-r);display:flex;flex-direction:column;gap:14px}
.memo{border:1px dashed var(--memo);background:var(--memo-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:13px}
.memo b.t{color:var(--memo);display:block;margin-bottom:4px}
.memo ul{margin:0;padding-left:18px} .memo li{margin:2px 0}
body.nomemo .memo{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card h2{font-size:15px;margin:0 0 10px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card h2 .sub{font-size:12px;color:var(--muted);font-weight:normal}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.b{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:7px 12px;cursor:pointer}
.b.p{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.b.d{color:var(--bad)}
.b.sm{padding:3px 9px;font-size:12px}
.b:focus-visible,.stepper button:focus-visible,.side button:focus-visible,.chips button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--muted)}
.tile b{display:block;font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums}
.todo{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.todo li{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;flex-wrap:wrap}
.todo li .what{flex:1 1 260px;min-width:0}
.todo li .where{font-size:12px;color:var(--muted)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--head);white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--accent-soft)}
tr.sum td{background:var(--head);font-weight:bold}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:12px;margin:1px 2px 1px 0;white-space:nowrap}
.t-bad{background:var(--bad-soft);color:var(--bad)} .t-warn{background:var(--warn-soft);color:var(--warn)}
.t-ok{background:var(--ok-soft);color:var(--ok)} .t-info{background:var(--accent-soft);color:var(--accent)}
.t-wait{background:var(--sunk);color:var(--muted)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:14px;padding:3px 10px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.muted{color:var(--muted)}
.notice{padding:9px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}
.icard{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.icard.bad{border-left-color:var(--bad)} .icard.ok{border-left-color:var(--ok)}
.icard .hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.icard .hd .amt{margin-left:auto;font-variant-numeric:tabular-nums}
.icard .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.icard .acts input{flex:1 1 200px;min-width:0}
.cards{display:flex;flex-direction:column;gap:8px}
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.check li{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;flex-wrap:wrap}
.check .mk{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:bold;flex:none}
.mk.y{background:var(--ok-soft);color:var(--ok)} .mk.n{background:var(--bad-soft);color:var(--bad)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}
textarea{width:100%;min-height:230px;background:var(--panel);font-size:13px}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:0;width:min(980px,95vw)}
dialog .in{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
dialog h3{margin:0}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.dbox{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.dbox h4{margin:0 0 6px;font-size:13px;color:var(--accent)}
.gate{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.gate .notice{flex:1 1 300px}
@media (prefers-reduced-motion: no-preference){.stepper button{transition:border-color .15s}}
</style>

<div class="proto">
  <b>화면 시안</b><span>가짜 자료로 만든 화면 배치 확인용입니다. 버튼은 동작하지 않고 단계 이동과 상세 카드만 열립니다.</span>
  <label><input type="checkbox" id="memoToggle" checked> 시안 메모 보기</label>
</div>
<header>
  <h1>교직원 자녀학비보조 관리</h1>
  <div class="qbox">
    <select id="qsel" aria-label="분기 선택"><option>2026년 3분기 · 기준일 2026-09-01</option><option>2026년 2분기 · 기준일 2026-06-01 (마감)</option></select>
    <span class="tag t-info">진행 중</span>
    <button class="b sm" type="button">+ 새 분기</button>
  </div>
  <div class="side">
    <span class="saved">앱 저장소에 저장됨 14:32</span>
    <button type="button" data-go="staff" aria-pressed="false">명부</button>
    <button type="button" data-go="set" aria-pressed="false">설정·백업</button>
  </div>
</header>
<nav class="stepper" id="stepper" aria-label="분기 업무 단계"></nav>
<main id="view"></main>
<dialog id="dlg"><div class="in" id="dlgin"></div></dialog>

<script>
'use strict';
// ===== 가짜 자료 (시험용 이름·학교, 실제 자료 아님)
const A = [
  {id:1, n:'김가상', org:'분당차병원', kind:'대학생', child:'김하나', school:'가상대학교', req:4000000, pay:4000000, judge:'지급', is:[]},
  {id:2, n:'이시험', org:'강남차병원', kind:'대학생', child:'이둘째', school:'시험대학교', req:4800000, pay:4747000, judge:'', is:[['bad','교번 미확인'],['bad','급여계좌 미등록'],['info','학생회비 53,000원 제외']]},
  {id:3, n:'박예시', org:'차의과학대학교', kind:'대학생', child:'박셋째', school:'예시대학교', req:3500000, pay:2201500, judge:'', is:[['warn','신청서 금액 ≠ 영수증 금액'],['info','장학금 1,298,500원 차감']]},
  {id:4, n:'최더미', org:'일산차병원', kind:'대학생', child:'최넷째', school:'더미대학교', req:3200000, pay:0, judge:'', is:[['bad','실납부액 0원(장학금 전액 감면)']]},
  {id:5, n:'정샘플', org:'분당차병원', kind:'대학생', child:'정다섯', school:'샘플대학교', req:5600000, pay:5000000, judge:'지급', is:[['info','한도 적용']]},
  {id:6, n:'한가짜', org:'구미차병원', kind:'대학생', child:'한여섯', school:'가짜대학교', req:3809000, pay:3809000, judge:'', is:[['warn','다른 신청인과 같은 계좌']]},
  {id:7, n:'오테스', org:'구미차병원', kind:'고등학생', child:'오여덟', school:'테스트고등학교', req:620000, pay:500000, judge:'', is:[['warn','다른 신청인과 같은 계좌'],['info','한도 적용']]},
  {id:8, n:'윤모의', org:'강남차병원', kind:'고등학생', child:'윤아홉', school:'모의고등학교', req:450000, pay:0, judge:'', is:[['bad','인정 항목 없음(학원 교육비)']]},
  {id:9, n:'장해외', org:'차의과학대학교', kind:'대학생', child:'장열', school:'Sample University', req:5000000, pay:5000000, judge:'', is:[['wait','임용일 확인 대기(교무팀)'],['info','국외학교']]},
  {id:10, n:'강신입', org:'분당차병원', kind:'대학생', child:'강열둘', school:'신입대학교', req:3000000, pay:3000000, judge:'', is:[['wait','임용일 확인 대기(의전원)']]},
  {id:11, n:'문두명', org:'일산차병원', kind:'대학생', child:'문열셋', school:'두명대학교', req:4500000, pay:4500000, judge:'지급', is:[['info','자녀 8학기 초과(총 24학기 안)']]},
  {id:12, n:'문두명', org:'일산차병원', kind:'대학생', child:'문열넷', school:'두명대학교', req:4200000, pay:4200000, judge:'지급', is:[]},
  {id:13, n:'서누락', org:'차의과학대학교', kind:'고등학생', child:'서열하나', school:'누락고등학교', req:480000, pay:480000, judge:'보류', is:[['bad','가족관계증명서·등본 없음']], reason:'서류 보완 요청함(11/14)'},
  {id:14, n:'노정상', org:'강남차병원', kind:'대학생', child:'노열다섯', school:'정상대학교', req:2900000, pay:2900000, judge:'', is:[]},
  {id:15, n:'백제외', org:'분당차병원', kind:'고등학생', child:'백열여섯', school:'제외고등학교', req:300000, pay:0, judge:'제외', is:[['bad','신청기한 경과']], reason:'마감 후 접수'},
];
const ORGS = ['강남차병원', '구미차병원', '분당차병원', '일산차병원', '차의과학대학교'];
const won = n => Number(n).toLocaleString('ko-KR');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const has = (a, lv) => a.is.some(i => i[0] === lv);
function state(a) {
  if (a.judge) return a.judge;
  if (has(a, 'bad')) return '오류'; if (has(a, 'warn')) return '확인 필요'; if (has(a, 'wait')) return '확인 대기'; return '판정 대기';
}
const ST_CLS = {'지급':'t-ok','보류':'t-warn','제외':'t-wait','오류':'t-bad','확인 필요':'t-warn','확인 대기':'t-wait','판정 대기':'t-info'};
const pill = a => `<span class="tag ${ST_CLS[state(a)]}">${state(a)}</span>`;
const tags = (a, lvs = ['bad','warn','wait','info']) => a.is.filter(i => lvs.includes(i[0])).map(([l, m]) => `<span class="tag t-${l}">${esc(m)}</span>`).join('') || '<span class="tag t-ok">이상 없음</span>';
const live = A.filter(a => a.judge !== '제외');
const cnt = s => A.filter(a => state(a) === s).length;

// ===== 단계
const STEPS = [
  {k:'home', no:'0', nm:'현황', st:'다음 할 일 4건', c:'s-doing'},
  {k:'intake', no:'1', nm:'접수', st:`${A.length}건 접수 · 마감일 지남`, c:'s-done'},
  {k:'person', no:'2', nm:'신청인 확인', st:'임용일 대기 2 · 교번 1 · 계좌 1', c:'s-warn'},
  {k:'review', no:'3', nm:'검토·판정', st:`오류 ${cnt('오류')} · 확인 ${cnt('확인 필요')} · 대기 ${cnt('판정 대기') + cnt('확인 대기')}`, c:'s-bad'},
  {k:'draft', no:'4', nm:'기안', st:'판정 끝나면 진행', c:'s-wait'},
  {k:'upload', no:'5', nm:'지급 업로드', st:'기안 결재 후', c:'s-wait'},
  {k:'close', no:'6', nm:'마감', st:'조건 2/5 충족', c:'s-wait'},
];
let cur = 'home';
const memo = (title, items) => `<div class="memo"><b class="t">시안 메모 · ${title}</b><ul>${items.map(x => `<li>${x}</li>`).join('')}</ul></div>`;
const go = k => `<button class="b sm" type="button" data-go="${k}">${STEPS.find(s => s.k === k)?.nm || ({staff:'명부', set:'설정·백업'})[k]}(으)로</button>`;
const gate = (msg, k) => `<div class="gate"><div class="notice">${msg}</div>${k ? go(k) : ''}</div>`;
const sum = l => l.reduce((s, a) => s + a.pay, 0);

function appTable(list, cols = 'full') {
  return `<div class="scroll"><table><thead><tr><th>상태</th><th>소속</th><th>신청인</th><th>자녀</th><th>구분</th><th>학교</th><th class="n">신청금액</th><th class="n">실 지급(예정)</th>${cols === 'full' ? '<th>확인할 점</th>' : ''}</tr></thead><tbody>
  ${list.map(a => `<tr class="click" data-app="${a.id}"><td>${pill(a)}</td><td>${esc(a.org)}</td><td>${esc(a.n)}</td><td>${esc(a.child)}</td><td>${a.kind === '대학생' ? '대' : '고'}</td><td>${esc(a.school)}</td><td class="n">${won(a.req)}</td><td class="n"><b>${won(a.pay)}</b></td>${cols === 'full' ? `<td>${tags(a, ['bad','warn','wait'])}</td>` : ''}</tr>`).join('')}
  </tbody></table></div>`;
}

function detail(id) {
  const a = A.find(x => x.id === id);
  document.getElementById('dlgin').innerHTML = `<h3>${pill(a)} ${esc(a.n)} · ${esc(a.child)} (${a.kind})</h3>
  <div class="memo"><b class="t">시안 메모 · 한 명 상세 카드</b><ul><li>지금과 같은 내용입니다. 어느 단계에서 눌러도 같은 카드가 열리고, 판정 버튼도 여기 있습니다.</li><li>문제마다 해결할 단계로 가는 링크를 붙입니다.</li></ul></div>
  <div class="dgrid">
    <div class="dbox"><h4>신청인</h4><div class="kv"><span>소속</span><span>${esc(a.org)}</span><span>확인 임용일</span><span>${has(a, 'wait') ? '회신 대기' : '2012-09-01 (의전원)'}</span><span>근속</span><span>${has(a, 'wait') ? '—' : '14년'}</span><span>지원 가능 자녀</span><span>3명</span></div></div>
    <div class="dbox"><h4>금액</h4><div class="kv"><span>신청금액</span><span>${won(a.req)}원</span><span>실 지급(예정)</span><span><b>${won(a.pay)}원</b></span><span>차이 사유</span><span>${a.req === a.pay ? '없음' : a.is.filter(i => i[0] === 'info').map(i => i[1]).join(', ') || '영수증 인정액 다름'}</span></div></div>
    <div class="dbox"><h4>확인할 점</h4>${tags(a)}</div>
    <div class="dbox"><h4>서류·계좌</h4><div class="kv"><span>서류</span><span>신청서 O · 확인란 O · 가족관계 O · 영수증 O</span><span>지급 계좌</span><span>급여계좌</span></div></div>
  </div>
  <div class="row"><input placeholder="사유" style="flex:1 1 220px" aria-label="사유"><button class="b sm" type="button">지급</button><button class="b sm" type="button">보류</button><button class="b sm d" type="button">제외</button><button class="b sm" type="button">내용 수정</button><button class="b" type="button" id="dclose" style="margin-left:auto">닫기</button></div>`;
  document.getElementById('dlg').showModal();
  document.getElementById('dclose').onclick = () => document.getElementById('dlg').close();
}

function render() {
  document.getElementById('stepper').innerHTML = STEPS.map(s => `<button type="button" class="${s.c}" data-go="${s.k}" ${cur === s.k ? 'aria-current="step"' : ''}><span class="dot"></span><span class="no">${s.no === '0' ? '분기 현황' : '단계 ' + s.no}</span><span class="nm">${s.nm}</span><span class="st">${s.st}</span></button>`).join('');
  document.querySelectorAll('.side [data-go]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.go === cur)));
  document.getElementById('view').innerHTML = V[cur]();
}
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g && g.dataset.go) { cur = g.dataset.go; render(); if (document.getElementById('dlg').open) document.getElementById('dlg').close(); window.scrollTo({top: 0}); return; }
  const ap = e.target.closest('[data-app]'); if (ap) { detail(+ap.dataset.app); return; }
  const f = e.target.closest('#rvf [data-f]'); if (f) { rvF = f.dataset.f; render(); return; }
  const m = e.target.closest('#rvm [data-m]'); if (m) { rvMode = m.dataset.m; render(); return; }
  const o = e.target.closest('[data-org]');
  if (o) { const l = A.filter(a => a.org === o.dataset.org);
    document.getElementById('orgList').innerHTML = `<h2 style="margin-top:14px">${esc(o.dataset.org)} 명단 <span class="sub">${l.length}건 · 줄을 누르면 상세</span></h2>${appTable(l, 'short')}`; }
});
document.getElementById('memoToggle').onchange = e => document.body.classList.toggle('nomemo', !e.target.checked);
render();
</script>
