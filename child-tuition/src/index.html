<!doctype html>
<html lang="ko">
<head><meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자녀학비보조 관리</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1d2330; --muted:#677084; --line:#dfe3ea;
  --accent:#1f5fbf; --accent-soft:#e8f0fc; --ok:#1e7a46; --ok-soft:#e5f4ea;
  --warn:#a35a00; --warn-soft:#fff3e0; --bad:#b3261e; --bad-soft:#fdeceb; --input:#fffdf3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0}
header .q{display:flex;gap:8px;align-items:center}
nav{display:flex;gap:4px;flex-wrap:wrap;padding:8px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
nav button{border:0;background:none;padding:8px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font:inherit}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:bold}
main{padding:20px;max-width:1500px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--input);color:var(--ink)}
input[type=checkbox]{width:16px;height:16px}
textarea{width:100%;min-height:260px;font-family:inherit;background:#fff}
button.b{font:inherit;border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 12px;cursor:pointer}
button.p{background:var(--accent);border-color:var(--accent);color:#fff}
button.d{color:var(--bad)}
button.b:disabled{opacity:.5;cursor:default}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:#f0f2f6;font-weight:bold;position:sticky;top:0}
td.n,th.n{text-align:right;white-space:nowrap}
td.nw{white-space:nowrap}
.scroll{overflow:auto;max-height:65vh}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:12px;margin:1px 2px 1px 0;white-space:nowrap}
.t-bad{background:var(--bad-soft);color:var(--bad)}
.t-warn{background:var(--warn-soft);color:var(--warn)}
.t-ok{background:var(--ok-soft);color:var(--ok)}
.t-info{background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-size:22px}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.step{flex:1 1 140px;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff}
.step.done{border-color:var(--ok);background:var(--ok-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.notice{padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn);margin-bottom:12px}
.hidden{display:none}
.han{font-size:12px;color:var(--accent);min-height:16px}
tr.excluded td{color:#999;text-decoration:line-through}
tr.excluded td.keep{text-decoration:none}
dialog{border:1px solid var(--line);border-radius:12px;padding:0;max-width:820px;width:95%}
dialog .in{padding:18px 20px}
dialog h3{margin:0 0 12px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.form .wide{grid-column:1/-1}
.chk{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:13px}
fieldset{border:1px solid var(--line);border-radius:8px;padding:8px 12px}
legend{font-size:12px;color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:bold;white-space:nowrap}
.t-ex{background:#eceef2;color:#677084}
nav .sep{width:1px;background:var(--line);margin:4px 8px}
nav button.sub{font-size:13px}
.strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.strip div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--muted)}
.strip b{display:block;font-size:17px;color:var(--ink)}
tr.click{cursor:pointer} tr.click:hover td{background:#f4f8ff}
.flt{display:flex;gap:4px;flex-wrap:wrap}
.flt button{font:inherit;font-size:12px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 10px;cursor:pointer}
.flt button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.icard{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.icard.bad{border-left-color:var(--bad)}
.icard .hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.icard ul{margin:4px 0 8px 18px;padding:0}
.icard li{margin:2px 0}
.li-bad{color:var(--bad)} .li-warn{color:var(--warn)} .li-info{color:var(--muted)}
dialog.wide{max-width:1100px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:800px){.dgrid{grid-template-columns:1fr}}
.dbox{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.dbox h4{margin:0 0 6px;font-size:13px;color:var(--accent)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:2px 8px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}
.big{font-size:20px;font-weight:bold}
tr.sub td{background:#f7f8fb;font-weight:bold}
#toast{position:fixed;bottom:20px;right:20px;background:#1d2330;color:#fff;padding:10px 14px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none}
#toast.on{opacity:.95}
</style>
</head>
<body>
<header>
  <h1>교직원 자녀학비보조 관리</h1>
  <div class="q">
    <select id="qsel" aria-label="분기 선택"></select>
    <button class="b" id="newq">새 분기</button>
    <span id="qstate" class="tag"></span>
  </div>
  <span class="muted" id="saved"></span>
</header>
<nav id="tabs"></nav>
<main id="view"></main>
<dialog id="dlg"><div class="in" id="dlgin"></div></dialog>
<div id="toast"></div>

<script>/*XLSX_LIB*/</script>
<script>
'use strict';
// ===== 규정 기준 (교직원 자녀 학비보조에 관한 규정, 2024.12.26.)
const RULE = {
  hsLimit: 500000, hsYears3: 3,
  uLimit: 5000000, uMin: 3, u3: 10, boMin: 2, choMin: 3, bo3: 5, childSem: 8,
};
const BOJIK = ['총장', '부총장', '대학원장', '학장', '처장'];
const ORGS_DEFAULT = ['강남차병원', '구미차병원', '분당차병원', '일산차병원', '차의과학대학교'];
const BANKS = ["KB국민은행", "우리은행", "SC제일은행", "신한은행", "우체국", "IBK기업은행", "외환은행", "하나은행", "서울은행", "농협은행", "농협(단위)", "수협", "축협", "산업은행", "대구은행", "부산은행", "광주은행", "제주은행", "전북은행", "경남은행", "MG새마을금고", "신협", "장기신용은행", "한국씨티은행", "외국은행", "산림조합중앙회", "웰컴저축은행", "카카오뱅크", "K뱅크", "토스뱅크", "한국교직원공제회", "현대카드", "하나카드", "우리카드", "신한카드", "유안타증권", "대신증권", "제이피모간체이스은행", "무통장"];
const BANK_ALIAS = {'iM뱅크': '대구은행', 'iM뱅크(구 대구은행)': '대구은행', '국민은행': 'KB국민은행', '기업은행': 'IBK기업은행',
  'NH농협은행': '농협은행', '농협': '농협은행', '씨티은행': '한국씨티은행', '새마을금고': 'MG새마을금고', '케이뱅크': 'K뱅크'};
const STATUS = ['재직', '휴직', '정직', '퇴직', '임상교수 전환', '기타 제외'];
const KEY = 'child-tuition-v1';

// ===== 저장소
let DB;
function blank() {
  return {ver: 1, staff: {}, children: {}, quarters: {}, cur: null,
    settings: {orgs: ORGS_DEFAULT.slice(), bankAlias: Object.assign({}, BANK_ALIAS), budget: {}}};
}
function load() {
  try { DB = JSON.parse(localStorage.getItem(KEY)) || blank(); } catch (e) { DB = blank(); }
  if (!DB.settings) DB.settings = blank().settings;
}
let dirty = false;
function save() {
  DB.savedAt = new Date().toISOString();
  try { localStorage.setItem(KEY, JSON.stringify(DB)); dirty = true;
    document.getElementById('saved').textContent = '자동 저장됨 ' + DB.savedAt.slice(11, 16) + ' · 백업 파일은 설정 탭에서';
  } catch (e) { alertBox('브라우저 저장에 실패했습니다. 설정 탭에서 백업 파일을 내려받으세요.'); }
}

// ===== 유틸
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const won = n => (n === '' || n == null || isNaN(n)) ? '' : Number(n).toLocaleString('ko-KR');
const num = v => { if (v === '' || v == null) return null; const x = Number(String(v).replace(/[^0-9.-]/g, '')); return isNaN(x) ? null : x; };
function hanAmt(n) {
  n = Number(n); if (!n || isNaN(n) || n < 0) return '';
  const d = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'], u = ['', '십', '백', '천'], b = ['', '만', '억', '조'];
  let out = '', i = 0;
  while (n > 0) { const part = n % 10000; n = Math.floor(n / 10000);
    if (part) { let t = ''; String(part).padStart(4, '0').split('').forEach((c, k) => { if (c !== '0') t += d[+c] + u[3 - k]; }); out = t + b[i] + out; }
    i++; }
  return out + '원';
}
const EXCL_RE = /학생회|급식|기숙|생활관|교재|앨범|보험|동문|수학여행|체험|방과후|간식|교복|실습|행사|우유|후원|발전기금|단체복|졸업/;
function eligibleItem(kind, name) {
  name = String(name || '');
  if (EXCL_RE.test(name)) return false;
  return kind === '고등학생' ? /수업료|운영|육성|입학금|등록금/.test(name) : /수업료|등록금|입학금|기성회/.test(name);
}
function parseItems(kind, text) {
  return String(text || '').split(/[;\n]/).map(x => x.trim()).filter(Boolean).map(x => {
    const m = x.match(/^(.*?)[:：]\s*([0-9,]+)\s*(\((제외|인정)\))?$/); if (!m) return null;
    const name = m[1].trim(), amt = num(m[2]);
    return {name, amt, ok: m[4] ? m[4] === '인정' : eligibleItem(kind, name)};
  }).filter(Boolean);
}
const itemSum = (items, ok) => (items || []).filter(i => ok == null || !!i.ok === ok).reduce((s, i) => s + (num(i.amt) || 0), 0);
function acctOf(a) {
  const s = DB.staff[a.sab] || {};
  return a.acctType === '별도' ? {bank: a.bank || '', acct: a.acct || '', type: '신청서 기재'} : {bank: s.payBank || '', acct: s.payAcct || '', type: '급여계좌'};
}
const uid = () => Math.random().toString(36).slice(2, 10);
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 2200); }
function alertBox(m) { openDlg(`<h3>알림</h3><p>${esc(m)}</p><div class="row"><button class="b p" onclick="closeDlg()">확인</button></div>`); }
function ymd(v) {
  if (!v) return '';
  if (v instanceof Date) { const d = new Date(v.getTime() - v.getTimezoneOffset() * 60000); return d.toISOString().slice(0, 10); }
  const s = String(v).trim(); const m = s.match(/(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);
  return m ? `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}` : '';
}
function months(from, to) {
  if (!from || !to) return null;
  const a = from.split('-').map(Number), b = to.split('-').map(Number);
  let m = (b[0] - a[0]) * 12 + (b[1] - a[1]); if (b[2] < a[2]) m--; return m;
}
const ym = m => m == null ? '' : `${Math.floor(m / 12)}년${m % 12}개월`;
const childKey = (sab, name) => sab + '|' + String(name).trim();
const bankStd = b => { b = String(b || '').trim(); return DB.settings.bankAlias[b] || b; };
const qBase = (y, q) => `${y}-${String([3, 6, 9, 12][q - 1]).padStart(2, '0')}-01`;
const Q = () => DB.quarters[DB.cur];
const qLabel = q => q ? `${q.year}년 ${q.q}분기` : '';
function confirmPlace(s) {
  if (s.kind === '직원') return '총무팀';
  return /병원|차움/.test(s.org || '') ? '의전원' : '교무팀';
}

// ===== 누적학기
function priorSem(key, qid) {
  const c = DB.children[key]; if (!c) return 0;
  const cur = DB.quarters[qid];
  let n = c.base || 0;
  for (const q of Object.values(DB.quarters)) {
    if (q.id === qid || !q.closed) continue;
    if (cur && (q.year * 10 + q.q) > (cur.year * 10 + cur.q)) continue;
    if (c.baseQ && (q.year * 10 + q.q) < c.baseQ) continue;
    for (const a of q.apps) if (childKey(a.sab, a.child) === key && a.kind === '대학생' && a.judge === '지급') n++;
  }
  return n;
}
function staffPriorSem(sab, qid) {
  let n = 0; for (const k in DB.children) if (DB.children[k].sab === sab) n += priorSem(k, qid); return n;
}
function lastAccount(sab, qid) {
  const cur = DB.quarters[qid]; let best = null;
  for (const q of Object.values(DB.quarters)) {
    if (q.id === qid || !q.closed || (q.year * 10 + q.q) > (cur.year * 10 + cur.q)) continue;
    for (const a of q.apps) if (a.sab === sab && a.judge === '지급' && (!best || q.year * 10 + q.q > best.k)) { const ac = acctOf(a); best = {k: q.year * 10 + q.q, acct: ac.acct, bank: ac.bank}; }
  }
  return best;
}

// ===== 규정 점검
function evaluate(q) {
  const res = new Map();
  const live = q.apps.filter(a => a.judge !== '제외');
  const cnt = {}; const dup = {};
  for (const a of live) { const k = a.sab + '|' + a.kind; cnt[k] = (cnt[k] || 0) + 1; }
  for (const a of q.apps) { const k = childKey(a.sab, a.child) + '|' + a.kind; dup[k] = (dup[k] || 0) + 1; }
  for (const a of q.apps) {
    const s = DB.staff[a.sab] || {};
    const issues = []; const add = (lv, m) => issues.push({lv, m});
    const conf = s.confDate || '';
    const m = months(conf, q.base);
    let maxKids = null, limit = a.kind === '고등학생' ? RULE.hsLimit : RULE.uLimit;
    if (!conf) add('warn', '임용일 미확인');
    else {
      if (s.applyDate && s.applyDate !== conf) add('info', '신청 임용일 상이(확인일 적용)');
      const bo = BOJIK.includes(s.bojik);
      if (a.kind === '고등학생') maxKids = m < RULE.hsYears3 * 12 ? 1 : 3;
      else if (bo) { const min = s.bojik === '처장' ? RULE.choMin : RULE.boMin; maxKids = m < min * 12 ? 0 : (m < RULE.bo3 * 12 ? 1 : 3); }
      else maxKids = m < RULE.uMin * 12 ? 0 : (m < RULE.u3 * 12 ? 1 : 3);
      if (maxKids === 0) add('bad', `재직기간 미달(${ym(m)})`);
      else if (cnt[a.sab + '|' + a.kind] > maxKids && a.judge !== '제외') add('bad', `자녀수 초과(한도 ${maxKids}명)`);
    }
    if (String(a.sab).startsWith('TEMP-')) add('bad', '교번 미확인');
    if (s.status && s.status !== '재직') add('bad', `신분: ${s.status}`);
    if (s.kind === '교원' && s.fulltime === false) add('bad', '전임교원 아님');
    if (dup[childKey(a.sab, a.child) + '|' + a.kind] > 1) add('bad', '같은 자녀 중복 신청');
    if (a.kind === '대학생' && q.q % 2 === 0) add('warn', '대학 학자금은 1·3분기(3월·9월) 지급');
    if (a.kind === '대학생' && a.grad) add('bad', '학부과정 아님');
    if (a.kind === '대학생') {
      const pc = priorSem(childKey(a.sab, a.child), q.id), ps = staffPriorSem(a.sab, q.id);
      // 제5조(2024.12.26 개정): 총 학기 범위 안에서 대상 자녀·수 조정 가능 → 자녀별 8학기는 참고 표시만, 한도는 신청인 총 학기로 판단
      if (pc + 1 > RULE.childSem) add('info', `자녀 ${pc + 1}학기째(1인당 ${RULE.childSem}학기 초과, 총 학기 안에서 조정)`);
      if (maxKids != null && maxKids > 0) { const cap = maxKids >= 3 ? 24 : 8; if (ps + 1 > cap) add('bad', `총학기 초과(기존 ${ps}/${cap})`); }
    }
    if (!a.docs?.form) add('bad', '신청서 없음');
    if (!a.docs?.family) add('bad', '가족관계증명서·등본 없음');
    if (!a.docs?.receipt) add('bad', '납입영수증 없음');
    else if (a.docs.receiptType === '불가서류') add('bad', '영수증 불가 서류(고지서·통장사본 등)');
    if (a.docs?.receipt && a.docs.receiptType === '사본') add('warn', '영수증 원본 아님');
    if (a.docs && a.docs.form && !a.docs.pledge) add('warn', '신청서 확인란(제5항) 서명 미확인');
    if (a.foreign) add('info', '국외학교: 학부과정·학자금 항목 확인');
    if (q.deadline && a.received && a.received > q.deadline) add('bad', `신청기한 경과(${a.received})`);
    // 금액
    const paid = num(a.receiptAmt), other = num(a.otherAid) || 0, req = num(a.amount);
    let base = paid != null ? paid - other : req;
    if (paid == null) add('warn', '영수증 금액 미입력');
    let pay = base == null ? 0 : Math.min(base, limit);
    if (req != null && pay > req) pay = req;
    if (req != null && paid != null && req !== paid) add('warn', `신청서 금액(${won(req)})과 영수증 금액(${won(paid)}) 다름`);

    const ex = (a.items || []).filter(i => !i.ok && num(i.amt));
    if (ex.length) add('info', `영수증 중 ${won(itemSum(a.items, false))}원 제외(${ex.map(i => i.name).join(', ')})`);

    if (other > 0) add('info', `타기관 지원 ${won(other)} 차감`);
    if (paid === 0 && (a.items || []).some(i => num(i.amt))) add('bad', '영수증에 인정 항목(수업료·등록금·입학금) 없음');

    const bk = bankStd(AC.bank);
    if (!bk) { if (acct) add('bad', '은행 없음'); } else if (BANKS.length && !BANKS.includes(bk)) add('warn', `은행명 코드표에 없음(${bk})`);

    res.set(a.id, {issues, months: m, maxKids, pay: a.judge === '지급' ? pay : 0, payable: pay, req, paid, other, base, limit,

function vOrg(v, q) {

  if (!orgs.includes(fOrg)) fOrg = orgs[0] || '';

  const ov = orgs.map(o => { const l = live.filter(a => ((DB.staff[a.sab] || {}).org || '기타') === o); return [o, agg(l, '고등학생'), agg(l, '대학생'), agg(l)]; });
  const T = [agg(live, '고등학생'), agg(live, '대학생'), agg(live)];

  const sec = k => { const l = mine.filter(a => a.kind === k); if (!l.length) return ''; const [n, p] = agg(l.filter(a => a.judge !== '제외'));
    return l.map((a, i) => { const s = DB.staff[a.sab] || {}; const x = r.get(a.id); const ac = acctOf(a); return `<tr class="click ${a.judge === '제외' ? 'excluded' : ''}" data-open="${a.id}">

      <td>${esc(a.child)}</td><td>${esc(a.school)} ${a.grade ? esc(a.grade) + '학년' : ''}</td><td class="n">${won(a.amount)}</td><td class="n"><b>${won(x.payable)}</b></td>
      <td>${esc(bankStd(ac.bank))}<br><span class="muted">${esc(ac.acct)}</span></td><td class="nw">${a.kind === '대학생' ? staffPriorSem(a.sab, q.id) + '회' : '-'}</td></tr>`; }).join('')
      + `<tr class="sub"><td colspan="7">${k} 소계 ${n}명</td><td></td><td class="n">${won(p)}</td><td colspan="2"></td></tr>`; };

    <table><thead><tr><th>기관</th><th class="n">고등학생</th><th class="n">금액</th><th class="n">대학생</th><th class="n">금액</th><th class="n">합계</th><th class="n">금액</th></tr></thead><tbody>
    ${ov.map(([o, h, u, t]) => `<tr class="click" data-org="${esc(o)}"><td><b>${esc(o)}</b></td><td class="n">${h[0]}</td><td class="n">${won(h[1])}</td><td class="n">${u[0]}</td><td class="n">${won(u[1])}</td><td class="n">${t[0]}</td><td class="n"><b>${won(t[1])}</b></td></tr>`).join('')}
    <tr class="sub"><td>합계</td><td class="n">${T[0][0]}</td><td class="n">${won(T[0][1])}</td><td class="n">${T[1][0]}</td><td class="n">${won(T[1][1])}</td><td class="n">${T[2][0]}</td><td class="n">${won(T[2][1])}</td></tr></tbody></table></div>

const isGyobun = x => /^[PU]\d{3,}$/i.test(String(x).trim());
function resolveSab(raw, name, org) {
  raw = String(raw || '').trim(); name = String(name || '').trim();
  if (isGyobun(raw)) return {sab: raw.toUpperCase(), note: ''};
  if (raw) for (const s of Object.values(DB.staff)) if ((s.hospNos || []).includes(raw)) return {sab: s.sab, note: ''};
  const cand = Object.values(DB.staff).filter(s => s.name === name && !s.sab.startsWith('TEMP-') && (!org || !s.org || s.org === org));
  if (cand.length === 1) {
    const s = cand[0]; if (raw) { s.hospNos = [...new Set([...(s.hospNos || []), raw])]; }
    return {sab: s.sab, note: raw ? `신청서 사번 ${raw} → 명부 교번 ${s.sab}(이름·기관으로 연결, 맞는지 확인)` : ''};
  }
  return {sab: 'TEMP-' + (raw || name), note: `교번 미확인(신청서 사번 ${raw || '없음'}): 인사담당 또는 시스템에서 확인 후 신청 수정에서 교번 입력`, hosp: raw};
}

// ----- 엑셀 가져오기 (기존 지원내역 양식)
function readBook(file) {
  return file.arrayBuffer().then(buf => {
    try { return XLSX.read(buf, {cellDates: true}); }
    catch (e) { throw new Error('파일을 열 수 없습니다. 암호가 걸린 파일이면 엑셀에서 암호를 해제한 뒤 다시 저장해 주세요.'); }
  });
}
function sheetRows(wb) {
  for (const n of wb.SheetNames) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[n], {header: 1, raw: true, defval: ''});
    const hi = rows.findIndex(r => r.some(c => String(c).replace(/\s/g, '').includes('교번/사번')));
    if (hi >= 0) return {head: rows[hi].map(h => String(h).replace(/\s/g, '')), rows: rows.slice(hi + 1)};
  }
  throw new Error('"교번/사번" 열이 있는 시트를 찾지 못했습니다.');
}
const col = (head, ...names) => { for (const n of names) { let i = head.indexOf(n); if (i < 0) i = head.findIndex(h => h.startsWith(n)); if (i >= 0) return i; } return -1; };

      bank: c(['은행']), acct: c(['계좌번호']), rec: c(['납입영수증']), fam: c(['가족관계증명서']), cum: c(['누적신청횟수', '누적']), note: c(['비고']),

function setConf(s, d, src, note) {
  const from = s.confDate || '';
  if (from === (d || '') && (note || '') === (s.confNote || '')) return false;
  (s.confHist || (s.confHist = [])).push({at: new Date().toISOString(), src, from, to: d || '', note: note || ''});
  s.confDate = d || ''; s.confBy = confirmPlace(s); s.confNote = note || '';
  if (from !== (d || '')) s.confAt = new Date().toISOString();
  return true;
}
async function importConfirm(file) {
  if (!file) return;
  try {
    const q = Q(); const {head, rows} = sheetRows(await readBook(file));
    const iS = col(head, '교번/사번'), iN = head.indexOf('비고'), iN2 = col(head, '확인비고');
    let iC = col(head, '전임최초임용일'); const fallback = iC < 0;
    if (fallback) iC = col(head, '임용일자');
    if (iC < 0) throw new Error('"전임최초임용일" 또는 "임용일자" 열이 없습니다. 회신 파일이 맞는지 확인해 주세요.');
    const plan = [], miss = [], seen = new Set();
    for (const r of rows) {
      const sab = String(r[iS] || '').trim(); if (!sab || seen.has(sab)) continue; seen.add(sab);
      const s = DB.staff[sab]; if (!s) { miss.push(sab); continue; }
      const d = ymd(r[iC]);
      const note = [iN >= 0 ? r[iN] : '', iN2 >= 0 ? r[iN2] : ''].map(x => String(x || '').trim()).filter(x => x && x !== '중복').join(' / ');
      const noteFinal = note || (!d ? '회신에 전임 임용일 없음' : '');
      let status = s.status || '재직';
      if (/임상/.test(note)) status = '임상교수 전환'; else if (/휴직/.test(note)) status = '휴직';
      else if (/정직/.test(note)) status = '정직'; else if (/퇴직|사직/.test(note)) status = '퇴직';
      const kind = !s.confDate && d ? '신규' : ((s.confDate || '') !== d ? '정정'
        : (status !== (s.status || '재직') || noteFinal !== (s.confNote || '') ? '비고·상태' : '같음'));
      plan.push({s, d, note: noteFinal, status, kind});
    }
    const place = plan.length ? confirmPlace(plan[0].s) : '';
    const logs = (q.confImports || []).filter(x => x.place === place);
    const prev = logs.find(x => x.file === file.name);
    const mod = file.lastModified ? new Date(file.lastModified).toLocaleString('ko-KR') : '';
    const older = logs.some(x => x.modRaw && file.lastModified && x.modRaw > file.lastModified);
    const ch = plan.filter(p => p.kind !== '같음');
    const cls = {신규: 't-ok', 정정: 't-bad', '비고·상태': 't-warn'};
    openDlg(`<h3>회신 반영 미리보기 (${esc(place)})</h3>
      <p><b>${esc(file.name)}</b> · 파일 수정 ${esc(mod)} · ${plan.length}명 중 바뀌는 사람 <b>${ch.length}명</b></p>
      ${prev ? `<div class="notice">같은 이름의 파일을 ${esc(prev.at.slice(0, 16).replace('T', ' '))}에 이미 불러왔습니다. 정정본이라면 아래 "정정" 줄이 맞는지 확인하세요.</div>` : ''}
      ${older ? `<div class="notice">이전에 불러온 ${esc(place)} 회신보다 수정일이 오래된 파일입니다. 최신 정정본이 맞는지 확인하세요.</div>` : ''}
      ${fallback ? `<div class="notice">이 파일에는 "전임최초임용일" 열이 없어 "임용일자" 열을 확인 값으로 읽었습니다. 회신처가 그 열을 직접 고쳐 보낸 파일인지 확인하세요. 프로그램에서 만든 확인 요청 엑셀로 요청하면 이 문제가 생기지 않습니다.</div>` : ''}
      ${miss.length ? `<p class="muted">명부에 없는 사번 ${miss.length}개(무시): ${esc(miss.join(', '))}</p>` : ''}
      <div class="scroll" style="max-height:45vh"><table><thead><tr><th>구분</th><th>사번</th><th>성명</th><th>현재 확인 임용일</th><th>회신 값</th><th>상태·비고</th></tr></thead><tbody>
      ${ch.map(p => `<tr><td><span class="tag ${cls[p.kind]}">${p.kind}</span></td><td>${esc(p.s.sab)}</td><td>${esc(p.s.name)}</td><td>${esc(p.s.confDate || '-')}</td><td><b>${esc(p.d || '-')}</b></td><td>${esc(p.status)} ${esc(p.note)}</td></tr>`).join('') || '<tr><td colspan="6">바뀌는 내용이 없습니다.</td></tr>'}
      </tbody></table></div><br>
      <div class="row"><button class="b p" id="cfok" ${ch.length ? '' : 'disabled'}>${ch.length}명 반영</button><button class="b" onclick="closeDlg()">취소</button></div>`);
    $('#cfok').onclick = () => {
      let changed = 0;
      for (const p of ch) { if (p.kind === '정정') changed++; setConf(p.s, p.d, file.name, p.note); p.s.status = p.status; }
      (q.confImports || (q.confImports = [])).push({file: file.name, mod, modRaw: file.lastModified || 0, at: new Date().toISOString(), n: ch.length, changed, place});
      closeDlg(); save(); render(); toast(`${ch.length}명 반영 (정정 ${changed}명)`);
    };

}

function summary(q, r) {
  const orgs = DB.settings.orgs.slice(); const m = {};
  for (const a of q.apps) { if (a.judge !== '지급') continue; const o = (DB.staff[a.sab] || {}).org || '기타'; if (!orgs.includes(o)) orgs.push(o);
    m[o] = m[o] || {hs: [0, 0], u: [0, 0]}; const t = a.kind === '고등학생' ? m[o].hs : m[o].u; t[0]++; t[1] += r.get(a.id).pay; t[2] = (t[2] || 0) + (num(a.amount) || 0); }
  const rows = orgs.map(o => ({o, hs: (m[o] || {}).hs || [0, 0], u: (m[o] || {}).u || [0, 0]}));
  const tot = rows.reduce((s, x) => ({hs: [s.hs[0] + x.hs[0], s.hs[1] + x.hs[1]], u: [s.u[0] + x.u[0], s.u[1] + x.u[1]]}), {hs: [0, 0], u: [0, 0]});
  const req = q.apps.filter(a => a.judge === '지급').reduce((s, a) => s + (num(a.amount) || 0), 0);
  return {rows, tot, req};
}

  $('#cp').onclick = () => { $('#memo').select(); document.execCommand('copy'); toast('복사했습니다'); };
  ['alloc', 'used'].forEach(k => $('#b_' + k).onchange = e => { b[k] = num(e.target.value); save(); render(); });

function payRows() { const q = Q(); const r = evaluate(q); return {q, r, list: q.apps.filter(a => a.judge === '지급')}; }
function exportList() {
  const {q, r} = payRows(); const head = ['no.', '구분', '소속', '부서', '직급', '교번/사번', '성명', '교원/직원', '보직구분', '임용일자', '기준일', '근속년수', '자녀성명', '학교명', '학년', '신청금액', '영수증 인정금액', '실 지급금액', '차액(신청-실지급)', '차이 사유', '은행', '계좌번호', '납입영수증', '가족관계증명서', '누적 신청횟수(~전분기)', '판정', '비고'];
  const rows = q.apps.map((a, i) => { const s = DB.staff[a.sab] || {}; const x = r.get(a.id);
    return [i + 1, a.kind, s.org, s.dept, s.rank, a.sab, s.name, s.kind, s.bojik || '', s.confDate || '', q.base, ym(x.months), a.child, a.school, a.grade, num(a.amount) ?? '', x.paid ?? '', a.judge === '지급' ? x.pay : 0, x.req != null ? x.req - (a.judge === '지급' ? x.pay : 0) : '', gapNote(a, x),
      bankStd(acctOf(a).bank), acctOf(a).acct, a.docs?.receipt ? 'O' : 'X', a.docs?.family ? 'O' : 'X', a.kind === '대학생' ? staffPriorSem(a.sab, q.id) : '-', a.judge + (a.exception ? '(예외)' : ''), a.reason || '']; });
  const pl = q.apps.filter(a => a.judge === '지급');
  const foot = ['', '', '', '', '', '', '합계', '', '', '', '', '', '', '', '', pl.reduce((s, a) => s + (num(a.amount) || 0), 0), '', pl.reduce((s, a) => s + r.get(a.id).pay, 0), '', '지급 판정 건 기준'];
  const ws = XLSX.utils.aoa_to_sheet([[`${q.year}학년도 자녀학비 보조금 신청(${q.year}년 ${q.q}분기)`], [], head, ...rows, foot]);
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, `${q.year}-${q.q}분기`);
  XLSX.writeFile(wb, `${q.year}학년도 ${q.q}분기 자녀학비 보조금 지원내역.xlsx`); markExported();
}
function textCells(ws, cols) { const rg = XLSX.utils.decode_range(ws['!ref']); for (let R = 1; R <= rg.e.r; R++) for (const C of cols) { const c = ws[XLSX.utils.encode_cell({r: R, c: C})]; if (c) { c.t = 's'; c.v = String(c.v); c.z = '@'; } } }
function exportCash() {
  const {q, r, list} = payRows();
  const aoa = [['출납구분', '출납금액', '출금대상구분', '거래처사업자번호', '외부인주민등록번호', '사번\n(5자리)', '학번\n(9자리)', '출금대상자', '출금대상계좌번호', '출금대상은행', '출금대상예금주명', '계좌표시내용'],
    ...list.map(a => { const s = DB.staff[a.sab] || {}; const ac = acctOf(a); return ['출금', r.get(a.id).pay, '교직원', '', '', a.sab, '', s.name, ac.acct, bankStd(ac.bank), s.name, '']; })];
  const ws = XLSX.utils.aoa_to_sheet(aoa); textCells(ws, [5, 8]);
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'sheet1');
  XLSX.writeFile(wb, `${q.year}년 ${q.q}분기_출납정보_업로드.xlsx`); markExported();

function exportPay() {
  const {q, r, list} = payRows();
  const head = ['소득구분', '소득자구분', '거래처사업자번호', '외부인주민등록번호', '사번', '학번', '군번', '거주구분', '지급금액', '실지급액', '소득세', '지방소득세', '국민연금개인부담금', '고용보험개인부담금', '건강보험개인부담금', '소득일자', '국세청업종코드', '일당금액', '근무일수', '근속연수', '소득내용', '은행', '계좌번호', '예금주명'];
  const aoa = [head, ...list.map(a => { const p = r.get(a.id).pay; const row = Array(24).fill(''); Object.assign(row, {0: '근로소득', 1: '교직원', 4: a.sab, 7: '거주', 8: p, 9: p}); return row; })];

}
function markExported() { const q = Q(); if (!q.exported) { q.exported = new Date().toISOString(); save(); } }

// ----- 명부
let sfilt = '';
function vStaff(v) {
  const list = Object.values(DB.staff).filter(s => !sfilt || [s.sab, s.name, s.org, s.dept].join(' ').includes(sfilt)).sort((a, b) => (a.org || '').localeCompare(b.org || '') || (a.name || '').localeCompare(b.name || ''));

  v.innerHTML = `<div class="card"><div class="row"><label>검색<input id="sf" value="${esc(sfilt)}"></label><label>급여계좌 엑셀 불러오기 (사번·은행·계좌번호 열)<input type="file" id="impPay" accept=".xlsx,.xls"></label>
  <span class="muted">${Object.keys(DB.staff).length}명 · 자녀 ${Object.keys(DB.children).length}명 · 누적학기는 마감된 분기 기준</span></div></div>
  <div class="card scroll"><table><thead><tr><th>사번</th><th>성명</th><th>소속·부서</th><th>교원/직원</th><th>보직</th><th>확인 임용일</th><th>확인처</th><th>상태</th><th>급여계좌</th><th>자녀(대학 누적학기)</th></tr></thead><tbody>
  ${list.map(s => `<tr><td>${esc(s.sab)}${(s.hospNos || []).length ? `<br><span class="muted">병원 ${esc(s.hospNos.join(', '))}</span>` : ''}</td><td>${esc(s.name)}</td><td>${esc(s.org)} ${esc(s.dept)}</td><td>${esc(s.kind)}</td><td>${esc(s.bojik)}</td>
    <td>${esc(s.confDate || '미확인')}</td><td>${esc(s.confBy || '')}</td><td>${esc(s.status || '재직')}</td>
    <td>${s.payAcct ? `${esc(s.payBank)} ${esc(s.payAcct)}<br><span class="muted">${esc(s.paySrc || '')}</span>` : '<span class="tag t-warn">미등록</span>'} <a href="#" data-pay="${esc(s.sab)}">수정</a></td>
    <td>${kids(s.sab).map(([k, c]) => `<span class="tag t-info">${esc(c.name)} ${qid ? priorSem(k, qid) : c.base}학기 <a href="#" data-k="${esc(k)}">수정</a></span>`).join('')}</td></tr>`).join('')}
  </tbody></table></div>`;
  $('#sf').oninput = e => { sfilt = e.target.value; const p = e.target.selectionStart; render(); const f = $('#sf'); f.focus(); f.setSelectionRange(p, p); };
  $('#impPay').onchange = e => importPayroll(e.target.files[0]);
  v.querySelectorAll('[data-pay]').forEach(el => el.onclick = e => { e.preventDefault(); const s = DB.staff[el.dataset.pay];
    openDlg(`<h3>${esc(s.name)} 급여계좌</h3><div class="row"><label>은행<input id="pb" list="bl2" value="${esc(s.payBank)}"><datalist id="bl2">${BANKS.map(b => `<option>${esc(b)}</option>`).join('')}</datalist></label><label>계좌번호<input id="pa" value="${esc(s.payAcct)}"></label>
      <button class="b p" id="pok">저장</button><button class="b" onclick="closeDlg()">취소</button></div>`);
    $('#pok').onclick = () => { s.payBank = $('#pb').value.trim(); s.payAcct = $('#pa').value.trim(); s.paySrc = '직접 입력 ' + new Date().toISOString().slice(0, 10); closeDlg(); save(); render(); }; });
  v.querySelectorAll('[data-k]').forEach(el => el.onclick = e => { e.preventDefault(); const c = DB.children[el.dataset.k];
    openDlg(`<h3>${esc(c.name)} 누적학기 보정</h3><p class="muted">프로그램 사용 전에 받은 대학 학자금 학기 수(시작값)입니다. 마감된 분기의 지급분은 자동으로 더해집니다.</p>
      <div class="row"><label>시작 학기 수<input id="cb" type="number" value="${c.base || 0}"></label><button class="b p" id="cbok">저장</button><button class="b" onclick="closeDlg()">취소</button></div>`);
    $('#cbok').onclick = () => { c.base = +$('#cb').value || 0; closeDlg(); save(); render(); }; });
}

async function importPayroll(file) {
  if (!file) return;
  try {
    const wb = await readBook(file); let head, rows;
    for (const n of wb.SheetNames) { const rr = XLSX.utils.sheet_to_json(wb.Sheets[n], {header: 1, raw: true, defval: ''});
      const hi = rr.findIndex(r => r.some(c => /사번/.test(String(c))) && r.some(c => /계좌/.test(String(c)))); if (hi >= 0) { head = rr[hi].map(h => String(h).replace(/\s/g, '')); rows = rr.slice(hi + 1); break; } }
    if (!head) throw new Error('"사번"과 "계좌" 열이 있는 시트를 찾지 못했습니다.');
    const iS = head.findIndex(h => /사번/.test(h)), iB = head.findIndex(h => /은행/.test(h)), iA = head.findIndex(h => /계좌/.test(h) && !/은행/.test(h));
    let n = 0, ch = 0;
    for (const r of rows) { const s = DB.staff[String(r[iS] || '').trim()]; const acct = String(r[iA] || '').trim(); if (!s || !acct) continue;
      if (s.payAcct && s.payAcct.replace(/-/g, '') !== acct.replace(/-/g, '')) ch++;
      s.payBank = String(r[iB] || '').trim(); s.payAcct = acct; s.paySrc = file.name; n++; }
    save(); render(); alertBox(`명부에 있는 ${n}명의 급여계좌를 반영했습니다.${ch ? ` 기존과 달라진 사람 ${ch}명.` : ''}`);
  } catch (e) { alertBox(e.message); }
}

// ----- 설정·백업
function vSet(v) {
  v.innerHTML = `<div class="grid2"><div class="card"><h2>백업</h2>
    <p>데이터는 이 PC의 브라우저에만 저장됩니다. 브라우저 기록을 지우거나 PC를 바꾸면 사라지므로, <b>작업이 끝날 때마다 백업 파일을 내려받아</b> 공유드라이브 등에 보관하세요.</p>
    <div class="row"><button class="b p" onclick="backup()">백업 파일 내려받기</button><label>백업 파일 불러오기<input type="file" id="rest" accept=".json"></label></div>
    <p class="muted">마지막 저장: ${esc(DB.savedAt || '-')}</p></div>
  <div class="card"><h2>은행명 변환</h2><p class="muted">신청서 표기 = 업로드 표기, 한 줄에 하나</p>
    <textarea id="alias" style="min-height:160px">${esc(Object.entries(DB.settings.bankAlias).map(([a, b]) => a + ' = ' + b).join('\n'))}</textarea><br><br><button class="b" id="alok">저장</button></div>
  <div class="card"><h2>기관 목록 (기안 집계표 순서)</h2><textarea id="orgs" style="min-height:120px">${esc(DB.settings.orgs.join('\n'))}</textarea><br><br><button class="b" id="orok">저장</button></div>
  <div class="card"><h2>분기 관리</h2>${Q() ? `<div class="row"><label>신청 마감일<input type="date" id="dl" value="${esc(Q().deadline)}"></label><button class="b d" id="delq">현재 분기 삭제</button></div>` : '분기 없음'}
    <br><button class="b d" id="wipe">전체 초기화</button></div></div>`;
  $('#rest').onchange = e => restore(e.target.files[0]);
  $('#alok').onclick = () => { const m = {}; $('#alias').value.split('\n').forEach(l => { const [a, b] = l.split('=').map(x => (x || '').trim()); if (a && b) m[a] = b; }); DB.settings.bankAlias = m; save(); toast('저장했습니다'); };
  $('#orok').onclick = () => { DB.settings.orgs = $('#orgs').value.split('\n').map(x => x.trim()).filter(Boolean); save(); toast('저장했습니다'); };
  if (Q()) { $('#dl').onchange = e => { Q().deadline = e.target.value; save(); };
    $('#delq').onclick = () => { if (confirmInline(`${qLabel(Q())}를 삭제할까요? 되돌릴 수 없습니다.`)) { delete DB.quarters[DB.cur]; DB.cur = Object.keys(DB.quarters)[0] || null; save(); render(); } }; }
  $('#wipe').onclick = () => { if (confirmInline('모든 데이터를 지울까요? 먼저 백업 파일을 내려받으세요.')) { DB = blank(); save(); render(); } };
}
function backup() {
  const blob = new Blob([JSON.stringify(DB, null, 1)], {type: 'application/json'}); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `자녀학비보조_백업_${new Date().toISOString().slice(0, 10)}.json`; a.click(); dirty = false;
}
async function restore(file) {
  if (!file) return;
  try { const d = JSON.parse(await file.text()); if (!d.staff || !d.quarters) throw 0; if (!confirmInline('현재 데이터를 백업 파일 내용으로 바꿀까요?')) return; DB = d; save(); render(); toast('불러왔습니다'); }
  catch (e) { alertBox('백업 파일 형식이 아닙니다.'); }
}

function closeDlg() { $('#dlg').close(); }

load(); render();

</script>
